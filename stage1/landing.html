<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Stage 1 Entry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#071126;
      --panel:#102044;
      --panel2:#0a1632;
      --border:#35528f;
      --text:#f2f7ff;
      --muted:#b6c7ea;
      --accent:#6cd6ff;
      --accent2:#4ff2c3;
      --r:20px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"Space Grotesk",system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:radial-gradient(760px 420px at 16% 18%, rgba(108,214,255,.16), transparent 58%),radial-gradient(860px 460px at 84% 82%, rgba(79,242,195,.14), transparent 60%),var(--bg);min-height:100vh}
    .wrap{max-width:980px;margin:0 auto;padding:26px 14px 70px}
    .card{border:1px solid rgba(255,255,255,.16);border-radius:var(--r);background:linear-gradient(0deg,var(--panel2),var(--panel));box-shadow:0 20px 48px rgba(0,0,0,.36);overflow:hidden}
    .head{padding:16px;border-bottom:1px solid rgba(255,255,255,.1)}
    .head h1{margin:0;font-size:26px;letter-spacing:.2px}
    .sub{margin-top:8px;color:var(--muted);font-weight:850;line-height:1.5}
    .body{padding:16px;display:grid;gap:14px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .field{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:var(--text);border-radius:14px;padding:11px 12px;font-weight:900;outline:none}
    .field::placeholder{color:rgba(242,247,255,.55)}
    .btn{appearance:none;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:var(--text);border-radius:14px;padding:11px 13px;font-weight:1000;cursor:pointer}
    .btn:hover{border-color:color-mix(in srgb,var(--accent) 64%, rgba(255,255,255,.2))}
    .btnPrimary{border-color:color-mix(in srgb,var(--accent2) 70%, rgba(255,255,255,.18));background:linear-gradient(180deg, rgba(79,242,195,.18), rgba(255,255,255,.04))}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media (max-width:820px){.grid{grid-template-columns:1fr}}
    .panel{border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:12px;background:rgba(255,255,255,.05)}
    .panel h2{margin:0 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.3px}
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:3px 8px;background:rgba(255,255,255,.08);font-size:12px;font-weight:900}
    .linkBox{font-size:12px;color:var(--muted);line-height:1.45;word-break:break-all;margin-top:8px}
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card">
      <div class="head">
        <h1>Stage 1 Entry</h1>
        <div class="sub">Set room + campus, then launch student or tutor track. Share links directly from here.</div>
      </div>
      <div class="body">
        <div class="row">
          <input id="roomInput" class="field" type="text" placeholder="room id (e.g. demo)" value="demo"/>
          <select id="campusSelect" class="field">
            <option value="upng">UPNG</option>
            <option value="monash">Monash</option>
          </select>
          <input id="groupInput" class="field" type="text" placeholder="tutor group (e.g. g1)" value="core"/>
          <button id="btnDashboard" class="btn">Open Dashboard</button>
        </div>

        <div class="grid">
          <article class="panel">
            <h2>Student Track</h2>
            <div class="row">
              <button id="btnStudent" class="btn btnPrimary">Open Student Step 1</button>
              <button id="btnCopyStudent" class="btn">Copy Link</button>
            </div>
            <div id="studentLink" class="linkBox"></div>
          </article>

          <article class="panel">
            <h2>Tutor Track</h2>
            <div class="row">
              <button id="btnTutor" class="btn btnPrimary">Open Tutor Step 1</button>
              <button id="btnCopyTutor" class="btn">Copy Link</button>
            </div>
            <div id="tutorLink" class="linkBox"></div>
          </article>
        </div>

        <div class="row">
          <span class="mono">Step 1 passcode: duck123</span>
          <span class="mono">Step 3 passcode: duck456</span>
          <button id="btnHome" class="btn">Back to Home</button>
        </div>
      </div>
    </section>
  </div>

  <script>
  (() => {
    const roomInput = document.getElementById("roomInput");
    const campusSelect = document.getElementById("campusSelect");
    const groupInput = document.getElementById("groupInput");
    const studentLink = document.getElementById("studentLink");
    const tutorLink = document.getElementById("tutorLink");

    const params = new URLSearchParams(location.search);
    const initialRoom = (params.get("room") || "demo").trim() || "demo";
    const initialCampus = ((params.get("campus") || "upng").trim().toLowerCase() === "monash") ? "monash" : "upng";
    const initialGroup = (params.get("group") || "core").trim() || "core";
    roomInput.value = initialRoom;
    campusSelect.value = initialCampus;
    groupInput.value = initialGroup;

    function values(){
      const room = (roomInput.value || "").trim() || "demo";
      const campus = (campusSelect.value || "upng").trim().toLowerCase() === "monash" ? "monash" : "upng";
      const group = (groupInput.value || "core").trim() || "core";
      return { room, campus, group };
    }

    function links(){
      const { room, campus, group } = values();
      const q = `room=${encodeURIComponent(room)}&campus=${encodeURIComponent(campus)}`;
      const student = `/stage1/step1.html?${q}`;
      const tutor = `/stage1/step1-tutor.html?${q}&group=${encodeURIComponent(group)}`;
      const dashboard = `/stage1/main-dashboard.html?${q}&group=${encodeURIComponent(group)}`;
      return { student, tutor, dashboard };
    }

    function render(){
      const x = links();
      studentLink.textContent = `${location.origin}${x.student}`;
      tutorLink.textContent = `${location.origin}${x.tutor}`;
    }

    async function copy(txt){
      try { await navigator.clipboard.writeText(txt); } catch {}
    }

    roomInput.addEventListener("input", render);
    campusSelect.addEventListener("change", render);
    groupInput.addEventListener("input", render);

    document.getElementById("btnStudent").addEventListener("click", () => { location.href = links().student; });
    document.getElementById("btnTutor").addEventListener("click", () => { location.href = links().tutor; });
    document.getElementById("btnDashboard").addEventListener("click", () => { location.href = links().dashboard; });
    document.getElementById("btnCopyStudent").addEventListener("click", () => copy(`${location.origin}${links().student}`));
    document.getElementById("btnCopyTutor").addEventListener("click", () => copy(`${location.origin}${links().tutor}`));
    document.getElementById("btnHome").addEventListener("click", () => { location.href = "/index.html"; });

    render();
  })();
  </script>
</body>
</html>
