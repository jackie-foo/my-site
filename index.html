<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jackie Foo</title>

  <meta name="description" content="Jackie Foo — soft launch landing page." />
  <meta name="theme-color" content="#ffc9e6" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink-1: #ffd9ee;
      --pink-2: #ffc7e7;
      --lavender: #d9d8ff;
      --sky: #c9ebff;
      --mint: #c9ffe8;
      --text: #4a2e4c;
      --muted: rgba(74, 46, 76, 0.72);
      --card: rgba(255, 255, 255, 0.72);
      --card-border: rgba(255, 255, 255, 0.82);
      --btn: #ff94c9;
      --btn-text: #4d1f3f;
      --link-bg: rgba(255, 255, 255, 0.72);
      --shadow: 0 24px 60px rgba(164, 96, 141, 0.26);
      --radius-xl: 30px;
      --radius-lg: 18px;
      --radius-pill: 999px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 20%, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0) 44%),
        radial-gradient(circle at 82% 74%, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0) 40%),
        linear-gradient(140deg, var(--pink-1) 0%, var(--lavender) 36%, var(--sky) 68%, var(--mint) 100%);
      overflow-x: hidden;
    }

    .sky {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -4;
      overflow: hidden;
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.34;
      animation: drift 16s ease-in-out infinite;
    }

    .shape.one {
      width: 42vmax;
      height: 42vmax;
      left: -12vmax;
      top: -10vmax;
      background: radial-gradient(circle at 35% 30%, rgba(255, 170, 215, 0.95), rgba(255, 170, 215, 0.12) 58%, transparent 76%);
      animation-delay: -3s;
    }

    .shape.two {
      width: 46vmax;
      height: 46vmax;
      right: -14vmax;
      top: -8vmax;
      background: radial-gradient(circle at 62% 32%, rgba(170, 199, 255, 0.9), rgba(170, 199, 255, 0.1) 58%, transparent 76%);
      animation-delay: -8s;
      animation-duration: 21s;
    }

    .shape.three {
      width: 52vmax;
      height: 52vmax;
      left: 16vmax;
      bottom: -28vmax;
      background: radial-gradient(circle at 44% 26%, rgba(172, 255, 225, 0.82), rgba(172, 255, 225, 0.08) 58%, transparent 76%);
      animation-delay: -5s;
      animation-duration: 25s;
    }

    .sparkles {
      position: absolute;
      inset: 0;
      opacity: 0.42;
      background-image:
        radial-gradient(rgba(255, 255, 255, 0.9) 1px, transparent 1px),
        radial-gradient(rgba(255, 255, 255, 0.7) 1px, transparent 1px);
      background-size: 34px 34px, 48px 48px;
      background-position: 0 0, 16px 12px;
      animation: twinkle 6s ease-in-out infinite;
    }

    #chibiCloud {
      position: fixed;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 8%, black 92%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, black 8%, black 92%, transparent 100%);
    }

    .chibiFloat {
      position: absolute;
      bottom: -110px;
      will-change: transform, opacity;
      animation-name: floatUp;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      opacity: 0.22;
      filter: drop-shadow(0 8px 12px rgba(159, 86, 138, 0.22));
    }

    .chibiFloat img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    .page {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: clamp(20px, 4vw, 52px);
    }

    .shell {
      width: min(1020px, 100%);
      border-radius: var(--radius-xl);
      border: 1px solid var(--card-border);
      background: linear-gradient(155deg, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.62));
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      padding: clamp(20px, 3vw, 38px);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .brand {
      font-size: 0.86rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: rgba(74, 46, 76, 0.72);
      font-weight: 700;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 148, 201, 0.46);
      background: rgba(255, 255, 255, 0.64);
      border-radius: var(--radius-pill);
      padding: 5px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #7b3a63;
    }

    .pill i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff7dbd;
      box-shadow: 0 0 0 0 rgba(255, 125, 189, 0.7);
      animation: ping 2s infinite;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(160px, 220px) 1fr;
      gap: clamp(16px, 3vw, 36px);
      align-items: center;
    }

    .avatarWrap {
      justify-self: center;
      width: min(220px, 42vw);
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-pill);
      padding: 8px;
      background: linear-gradient(145deg, rgba(255, 148, 201, 0.58), rgba(169, 210, 255, 0.66));
      box-shadow: 0 12px 36px rgba(149, 77, 124, 0.26);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.9);
      background: #fff;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transform: scale(1.05);
      display: block;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 7.5vw, 5.4rem);
      line-height: 0.94;
      letter-spacing: -0.04em;
    }

    .titleAccent {
      background: linear-gradient(92deg, #ff82be 0%, #9f8cff 52%, #5ecfff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .lead {
      margin: 14px 0 0;
      max-width: 58ch;
      color: var(--muted);
      font-size: clamp(1rem, 2.1vw, 1.06rem);
      line-height: 1.72;
      font-weight: 500;
    }

    .actions {
      margin-top: 22px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border-radius: 14px;
      border: 1px solid transparent;
      font: inherit;
      font-weight: 700;
      padding: 12px 16px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btnPrimary {
      background: linear-gradient(130deg, #ffb6dc, #ff94c9 58%, #ffd0e8);
      color: var(--btn-text);
      border-color: rgba(255, 136, 192, 0.5);
      box-shadow: 0 10px 24px rgba(200, 95, 150, 0.28);
    }

    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:focus-visible {
      outline: 3px solid rgba(255, 140, 194, 0.5);
      outline-offset: 3px;
    }

    .links {
      margin-top: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .link {
      text-decoration: none;
      color: #6b3a5f;
      background: var(--link-bg);
      border: 1px solid rgba(255, 255, 255, 0.84);
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 0.94rem;
      font-weight: 600;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .link:hover {
      background: #fff;
      transform: translateY(-1px);
    }

    .link:focus-visible {
      outline: 3px solid rgba(255, 140, 194, 0.5);
      outline-offset: 3px;
    }

    footer {
      margin-top: 24px;
      color: rgba(74, 46, 76, 0.58);
      font-size: 0.82rem;
      font-weight: 600;
    }

    @keyframes drift {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(3vw, -2vh) scale(1.05); }
      100% { transform: translate(0, 0) scale(1); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.28; }
      50% { opacity: 0.5; }
    }

    @keyframes ping {
      0% { box-shadow: 0 0 0 0 rgba(255, 125, 189, 0.7); }
      70% { box-shadow: 0 0 0 9px rgba(255, 125, 189, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 125, 189, 0); }
    }

    @keyframes floatUp {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg);
        opacity: 0;
      }
      10% { opacity: var(--o, 0.25); }
      50% {
        transform: translate3d(var(--drift, 18px), -56vh, 0) rotate(var(--rot, 6deg));
      }
      100% {
        transform: translate3d(calc(var(--drift, 18px) * -1), -124vh, 0) rotate(calc(var(--rot, 6deg) * -1));
        opacity: 0;
      }
    }

    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; }
      .avatarWrap { justify-self: start; }
    }

    @media (prefers-reduced-motion: reduce) {
      .shape,
      .sparkles,
      .pill i,
      .chibiFloat,
      .btn,
      .link {
        animation: none !important;
        transition: none !important;
      }
      #chibiCloud { display: none; }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="shape one"></div>
    <div class="shape two"></div>
    <div class="shape three"></div>
    <div class="sparkles"></div>
  </div>
  <div id="chibiCloud" aria-hidden="true"></div>

  <div class="page">
    <main class="shell">
      <div class="topbar">
        <div class="brand">Jackie Foo</div>
        <div class="pill"><i></i>Soft launch</div>
      </div>

      <section class="hero" aria-label="Intro">
        <div class="avatarWrap" aria-hidden="true">
          <div class="avatar">
            <img src="/pic/chibi1.png" alt="Jackie chibi" />
          </div>
        </div>

        <div>
          <h1><span class="titleAccent">Jackie Foo</span></h1>
          <p class="lead">
            Cute soft-launch page for now. More things are coming soon, but you can enter Stage 1 from here.
          </p>

          <div class="actions">
            <button class="btn btnPrimary" id="workshopBtn" type="button">Enter Stage 1</button>
          </div>

          <nav class="links" aria-label="Jackie links">
            <a class="link" href="#" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a class="link" href="#" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a class="link" href="mailto:you@email.com">Email</a>
            <a class="link" href="#" target="_blank" rel="noopener noreferrer">Resume</a>
          </nav>

          <footer>© <span id="year"></span> Jackie Foo</footer>
        </div>
      </section>
    </main>
  </div>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    document.getElementById("workshopBtn").addEventListener("click", () => {
      window.location.href = "/stage1/landing.html?room=demo&campus=upng";
    });

    const cloud = document.getElementById("chibiCloud");
    const count = Math.min(120, Math.max(48, Math.floor(window.innerWidth / 12)));

    for (let i = 0; i < count; i += 1) {
      const sprite = document.createElement("div");
      sprite.className = "chibiFloat";

      const size = 24 + Math.random() * 56;
      const left = Math.random() * 100;
      const duration = 18 + Math.random() * 20;
      const delay = Math.random() * -duration;
      const opacity = 0.08 + Math.random() * 0.25;
      const drift = -30 + Math.random() * 60;
      const rot = -10 + Math.random() * 20;
      const flip = Math.random() > 0.5 ? -1 : 1;

      sprite.style.width = `${size}px`;
      sprite.style.left = `${left}%`;
      sprite.style.animationDuration = `${duration}s`;
      sprite.style.animationDelay = `${delay}s`;
      sprite.style.setProperty("--o", opacity.toFixed(2));
      sprite.style.setProperty("--drift", `${drift.toFixed(0)}px`);
      sprite.style.setProperty("--rot", `${rot.toFixed(0)}deg`);

      const img = document.createElement("img");
      img.src = "/pic/chibi3.png";
      img.alt = "";
      img.style.transform = `scaleX(${flip})`;

      sprite.appendChild(img);
      cloud.appendChild(sprite);
    }
  </script>
</body>
</html>
