<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jackie Foo</title>
  <meta name="description" content="This is my internet corner, a little piece of me." />
  <meta name="theme-color" content="#ffcc7b" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-1: #fff4d8;
      --bg-2: #ffd897;
      --bg-3: #ffbe67;
      --ink: #4a2a12;
      --muted: #714a2c;
      --card: rgba(255, 250, 240, 0.82);
      --line: rgba(74, 42, 18, 0.16);
      --focus: rgba(239, 140, 35, 0.24);
      --ok: #1f6a43;
      --ok-bg: #d7f1e3;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      scroll-behavior: smooth;
      color: var(--ink);
      font-family: "Plus Jakarta Sans", sans-serif;
      background:
        radial-gradient(circle at 12% 12%, rgba(255, 255, 255, 0.55), transparent 38%),
        radial-gradient(circle at 84% 18%, rgba(255, 238, 199, 0.55), transparent 34%),
        linear-gradient(155deg, var(--bg-1) 0%, var(--bg-2) 48%, var(--bg-3) 100%);
      overflow-x: hidden;
    }

    .chibiRain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
      mask-image: linear-gradient(to bottom, transparent 0%, #000 10%, #000 90%, transparent 100%);
    }

    .drop {
      position: absolute;
      top: -140px;
      left: 0;
      width: var(--size, 66px);
      opacity: var(--op, 0.12);
      animation: fall var(--dur, 14s) linear infinite;
      animation-delay: var(--delay, 0s);
      filter: drop-shadow(0 8px 16px rgba(105, 59, 30, 0.16));
    }

    .drop img {
      display: block;
      width: 100%;
      height: auto;
      transform: scaleX(var(--flip, 1));
      user-select: none;
      -webkit-user-drag: none;
    }

    main {
      width: min(980px, calc(100% - 36px));
      margin: 0 auto;
    }

    .hero {
      min-height: 100vh;
      display: grid;
      align-content: center;
      gap: 18px;
      padding: clamp(30px, 6vw, 74px) 0;
    }

    .tag {
      width: fit-content;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      background: var(--card);
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.78rem;
      font-weight: 800;
      backdrop-filter: blur(2px);
    }

    h1 {
      margin: 0;
      font-family: "Sora", sans-serif;
      font-size: clamp(2.35rem, 7.2vw, 5.8rem);
      line-height: 0.95;
      letter-spacing: -0.03em;
      max-width: 13ch;
    }

    .lead {
      margin: 0;
      max-width: 54ch;
      font-size: clamp(1rem, 2.1vw, 1.14rem);
      line-height: 1.72;
      color: var(--muted);
      font-weight: 600;
    }

    .gate {
      margin-top: 8px;
      width: min(520px, 100%);
      display: grid;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
      backdrop-filter: blur(4px);
      padding: 12px;
    }

    .gateRow {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .gateInput {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 10px 12px;
      outline: none;
    }

    .gateInput:focus {
      border-color: rgba(239, 140, 35, 0.5);
      box-shadow: 0 0 0 3px var(--focus);
    }

    .gateBtn {
      border: 0;
      border-radius: 10px;
      background: #2d1709;
      color: #fff;
      font: inherit;
      font-size: 0.92rem;
      font-weight: 800;
      padding: 10px 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .hint {
      margin: 0;
      min-height: 1.2em;
      font-size: 0.84rem;
      font-weight: 700;
      color: #8a2e1e;
    }

    .hint.ok {
      width: fit-content;
      border-radius: 8px;
      border: 1px solid #89c7a4;
      background: var(--ok-bg);
      color: var(--ok);
      padding: 4px 8px;
    }

    .scrollHint {
      width: fit-content;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.7);
      padding: 8px 12px;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      text-decoration: none;
    }

    .next {
      min-height: 72vh;
      display: grid;
      place-items: center;
      padding: 40px 0 80px;
    }

    .coming {
      margin: 0;
      font-family: "Sora", sans-serif;
      font-size: clamp(2.7rem, 10vw, 7.4rem);
      line-height: 0.9;
      letter-spacing: -0.03em;
      text-align: center;
      color: #b54a1a;
    }

    @keyframes fall {
      0% {
        transform: translate3d(0, -12vh, 0) rotate(0deg);
      }
      100% {
        transform: translate3d(var(--drift, 14px), 120vh, 0) rotate(var(--rot, 10deg));
      }
    }

    @media (max-width: 760px) {
      main {
        width: min(980px, calc(100% - 24px));
      }

      .gateRow {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .drop {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="chibiRain" class="chibiRain" aria-hidden="true"></div>

  <main>
    <section class="hero" id="top">
      <span class="tag">Jackie Foo</span>
      <h1>This is my internet corner, a little piece of me.</h1>
      <p class="lead">A simple warm space for now. If you are joining the workshop, unlock Stage 1 below.</p>

      <section class="gate" aria-label="Stage 1 workshop gate">
        <div class="gateRow">
          <input id="pwInput" class="gateInput" type="password" placeholder="Enter workshop password" autocomplete="off" />
          <button id="openBtn" class="gateBtn" type="button">Open Stage 1</button>
        </div>
        <p id="hint" class="hint" aria-live="polite"></p>
      </section>

      <a class="scrollHint" href="#soon">Scroll for update</a>
    </section>

    <section id="soon" class="next">
      <h2 class="coming">Coming Soon</h2>
    </section>
  </main>

  <script>
    (() => {
      const WORKSHOP_PASS = "jackiefoo.me";
      const WORKSHOP_LINK = "/stage1/landing.html";

      const pwInput = document.getElementById("pwInput");
      const openBtn = document.getElementById("openBtn");
      const hint = document.getElementById("hint");
      const rain = document.getElementById("chibiRain");

      function tryOpen() {
        const value = (pwInput.value || "").trim();
        if (value !== WORKSHOP_PASS) {
          hint.textContent = "Wrong password. Please try again.";
          hint.className = "hint";
          pwInput.focus();
          return;
        }

        hint.textContent = "Unlocked. Opening Stage 1...";
        hint.className = "hint ok";
        setTimeout(() => {
          window.location.href = WORKSHOP_LINK;
        }, 220);
      }

      openBtn.addEventListener("click", tryOpen);
      pwInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          tryOpen();
        }
      });

      const count = Math.min(46, Math.max(24, Math.floor(window.innerWidth / 30)));
      for (let i = 0; i < count; i += 1) {
        const drop = document.createElement("div");
        drop.className = "drop";
        const size = 32 + Math.random() * 68;
        drop.style.setProperty("--size", `${size}px`);
        drop.style.left = `${Math.random() * 100}%`;
        drop.style.setProperty("--dur", `${10 + Math.random() * 12}s`);
        drop.style.setProperty("--delay", `${Math.random() * -18}s`);
        drop.style.setProperty("--op", `${0.07 + Math.random() * 0.12}`);
        drop.style.setProperty("--drift", `${-28 + Math.random() * 56}px`);
        drop.style.setProperty("--rot", `${-12 + Math.random() * 24}deg`);
        drop.style.setProperty("--flip", Math.random() > 0.5 ? "-1" : "1");

        const img = document.createElement("img");
        img.src = "/pic/chibi3.png";
        img.alt = "";

        drop.appendChild(img);
        rain.appendChild(drop);
      }
    })();
  </script>
</body>
</html>
