<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jackie Foo</title>
  <meta name="description" content="This is my internet corner, a little piece of me." />
  <meta name="theme-color" content="#ffcb79" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg1: #fff4d6;
      --bg2: #ffd992;
      --bg3: #ffbf65;
      --ink: #4a2a12;
      --muted: #6f482a;
      --card: rgba(255, 249, 238, 0.82);
      --line: rgba(74, 42, 18, 0.16);
      --focus: rgba(231, 133, 36, 0.22);
      --ok: #1f6c44;
      --okbg: #d8f2e3;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Plus Jakarta Sans", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 16%, rgba(255,255,255,0.6), transparent 36%),
        radial-gradient(circle at 85% 18%, rgba(255,243,212,0.65), transparent 34%),
        linear-gradient(155deg, var(--bg1) 0%, var(--bg2) 52%, var(--bg3) 100%);
      overflow-x: hidden;
    }

    .rain {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
      mask-image: linear-gradient(to bottom, transparent 0%, #000 10%, #000 92%, transparent 100%);
    }

    .drop {
      position: absolute;
      top: -140px;
      left: 0;
      width: var(--size, 70px);
      opacity: var(--op, 0.12);
      animation: fall var(--dur, 13s) linear infinite;
      animation-delay: var(--delay, 0s);
      filter: drop-shadow(0 8px 14px rgba(110, 62, 30, 0.14));
    }

    .drop img {
      width: 100%;
      height: auto;
      display: block;
      transform: scaleX(var(--flip, 1));
      user-select: none;
      -webkit-user-drag: none;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(22px, 4.6vw, 56px);
    }

    .hero {
      width: min(1020px, 100%);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--card);
      backdrop-filter: blur(6px);
      box-shadow: 0 20px 50px rgba(88, 49, 24, 0.16);
      padding: clamp(18px, 3vw, 34px);
      display: grid;
      grid-template-columns: 1.18fr minmax(230px, 330px);
      gap: clamp(18px, 3vw, 36px);
      align-items: center;
    }

    .heroCopy {
      animation: rise 650ms ease-out both;
    }

    .tag {
      width: fit-content;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 13px;
      background: rgba(255,255,255,0.75);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0 0;
      font-family: "Sora", sans-serif;
      font-size: clamp(2.1rem, 6.3vw, 4.8rem);
      line-height: 0.98;
      letter-spacing: -0.03em;
      max-width: 13ch;
    }

    .lead {
      margin: 14px 0 0;
      max-width: 55ch;
      color: var(--muted);
      font-size: clamp(0.98rem, 2vw, 1.08rem);
      line-height: 1.68;
      font-weight: 600;
    }

    .links {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .link {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.78);
      color: var(--ink);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 700;
      transition: transform 120ms ease, border-color 120ms ease;
    }

    .link:hover {
      transform: translateY(-1px);
      border-color: rgba(74, 42, 18, 0.32);
    }

    .gate {
      margin-top: 18px;
      width: min(500px, 100%);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
      background: rgba(255,255,255,0.72);
      display: grid;
      gap: 8px;
    }

    .gateRow {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .pw {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      font-size: 0.94rem;
      font-weight: 700;
      color: var(--ink);
      outline: none;
      background: #fff;
    }

    .pw:focus {
      border-color: rgba(231,133,36,0.5);
      box-shadow: 0 0 0 3px var(--focus);
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font: inherit;
      font-size: 0.92rem;
      font-weight: 800;
      color: #fff;
      background: #2e1709;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(50, 26, 12, 0.2);
    }

    .hint {
      margin: 0;
      min-height: 1.2em;
      font-size: 0.82rem;
      font-weight: 700;
      color: #8e2d1d;
    }

    .hint.ok {
      width: fit-content;
      border: 1px solid #90c9aa;
      border-radius: 8px;
      background: var(--okbg);
      color: var(--ok);
      padding: 4px 8px;
    }

    .profileCol {
      display: grid;
      justify-items: center;
      align-items: center;
      position: relative;
      animation: rise 720ms ease-out both;
    }

    .picWrap {
      width: clamp(220px, 30vw, 320px);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid var(--line);
      background: linear-gradient(145deg, #fff8ea, #ffe8bf);
      box-shadow: 0 22px 42px rgba(84, 47, 22, 0.2);
      position: relative;
      animation: bob 5.8s ease-in-out infinite;
    }

    .picWrap::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.75);
      pointer-events: none;
    }

    .picWrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transform: scale(1.08);
      display: block;
    }

    .profileGlow {
      width: clamp(180px, 24vw, 260px);
      height: clamp(180px, 24vw, 260px);
      border-radius: 50%;
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0));
      position: absolute;
      z-index: -1;
      transform: translateY(8px);
      filter: blur(1px);
      animation: pulse 4.6s ease-in-out infinite;
    }

    footer {
      margin-top: 12px;
      color: rgba(74, 42, 18, 0.66);
      font-size: 0.79rem;
      font-weight: 700;
    }

    @keyframes fall {
      from {
        transform: translate3d(0, -14vh, 0) rotate(0deg);
      }
      to {
        transform: translate3d(var(--drift, 16px), 120vh, 0) rotate(var(--rot, 10deg));
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bob {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.38;
        transform: translateY(8px) scale(1);
      }
      50% {
        opacity: 0.58;
        transform: translateY(8px) scale(1.05);
      }
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .profileCol {
        justify-items: center;
      }
    }

    @media (max-width: 760px) {
      .gateRow {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .drop,
      .heroCopy,
      .profileCol,
      .picWrap,
      .profileGlow,
      .btn {
        animation: none;
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div id="rain" class="rain" aria-hidden="true"></div>

  <div class="page">
    <main class="hero" aria-label="Intro">
      <section class="heroCopy">
        <span class="tag">Jackie Foo</span>
        <h1>This is my internet corner, a little piece of me.</h1>
        <p class="lead">A cute minimal space for now. If you are here for the workshop, you can unlock Stage 1 below.</p>

        <nav class="links" aria-label="Profile links">
          <a class="link" href="#" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a class="link" href="#" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a class="link" href="mailto:you@email.com">Email</a>
          <a class="link" href="#" target="_blank" rel="noopener noreferrer">Resume</a>
        </nav>

        <section class="gate" aria-label="Workshop gate">
          <div class="gateRow">
            <input id="pwInput" class="pw" type="password" placeholder="Enter workshop password" autocomplete="off" />
            <button id="openBtn" class="btn" type="button">Open Stage 1</button>
          </div>
          <p id="hint" class="hint" aria-live="polite"></p>
        </section>

        <footer>© <span id="year"></span> Jackie Foo</footer>
      </section>

      <section class="profileCol" aria-label="Profile image">
        <div class="profileGlow" aria-hidden="true"></div>
        <figure class="picWrap">
          <img src="/pic/chibi1.png" alt="Jackie chibi portrait" />
        </figure>
      </section>
    </main>
  </div>

  <script>
    (() => {
      const WORKSHOP_PASS = "jackiefoo.me";
      const WORKSHOP_LINK = "/stage1/landing.html";

      const year = document.getElementById("year");
      const pwInput = document.getElementById("pwInput");
      const openBtn = document.getElementById("openBtn");
      const hint = document.getElementById("hint");
      const rain = document.getElementById("rain");

      year.textContent = String(new Date().getFullYear());

      function openStage() {
        const value = (pwInput.value || "").trim();
        if (value !== WORKSHOP_PASS) {
          hint.textContent = "Wrong password. Please try again.";
          hint.className = "hint";
          pwInput.focus();
          return;
        }

        hint.textContent = "Unlocked. Opening Stage 1...";
        hint.className = "hint ok";
        setTimeout(() => {
          window.location.href = WORKSHOP_LINK;
        }, 220);
      }

      openBtn.addEventListener("click", openStage);
      pwInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          openStage();
        }
      });

      const count = Math.min(52, Math.max(28, Math.floor(window.innerWidth / 26)));
      for (let i = 0; i < count; i += 1) {
        const drop = document.createElement("div");
        drop.className = "drop";

        const size = 26 + Math.random() * 54;
        drop.style.setProperty("--size", `${size}px`);
        drop.style.left = `${Math.random() * 100}%`;
        drop.style.setProperty("--dur", `${9 + Math.random() * 11}s`);
        drop.style.setProperty("--delay", `${Math.random() * -20}s`);
        drop.style.setProperty("--op", `${0.06 + Math.random() * 0.1}`);
        drop.style.setProperty("--drift", `${-24 + Math.random() * 48}px`);
        drop.style.setProperty("--rot", `${-10 + Math.random() * 20}deg`);
        drop.style.setProperty("--flip", Math.random() > 0.5 ? "-1" : "1");

        const img = document.createElement("img");
        img.src = "/pic/chibi3.png";
        img.alt = "";

        drop.appendChild(img);
        rain.appendChild(drop);
      }
    })();
  </script>
</body>
</html>
