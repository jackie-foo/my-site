<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Jackie Foo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#07070b;
  --text:#f6f6ff;
  --muted:rgba(246,246,255,.66);
  --accent:#7c5cff;
  --accent2:#ff2bd6;
}

*{box-sizing:border-box}
html,body{height:100%}

body{
  margin:0;
  font-family:"Space Grotesk", sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:-20%;
  background:
    radial-gradient(700px 500px at 18% 10%, rgba(255,43,214,.14), transparent 60%),
    radial-gradient(820px 620px at 84% 20%, rgba(124,92,255,.14), transparent 62%);
  z-index:-1;
}

.container{max-width:980px; width:100%}

.hero{
  display:flex;
  align-items:center;
  gap:48px;
}

@media (max-width:780px){
  .hero{
    flex-direction:column;
    align-items:flex-start;
    gap:28px;
  }
}

/* Main chibi */
.chibi{
  width:clamp(160px, 26vw, 220px);
  aspect-ratio:1/1;
  border-radius:999px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.16);
  box-shadow:
    0 20px 60px rgba(0,0,0,.45),
    0 0 0 6px rgba(124,92,255,.08);
  flex-shrink:0;
}
.chibi img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transform:scale(1.03);
}

h1{
  font-size:clamp(56px, 8vw, 96px);
  margin:0;
  line-height:.92;
  letter-spacing:-.04em;
}

.highlight{
  position:relative;
  display:inline-block;
  padding:0 4px;
}
.highlight::after{
  content:"";
  position:absolute;
  left:0; right:0;
  bottom:10px;
  height:10px;
  background:rgba(124,92,255,.22);
  z-index:-1;
  transform:skewX(-10deg);
}

.lead{
  margin:20px 0 0;
  font-size:18px;
  line-height:1.75;
  color:var(--muted);
  max-width:58ch;
}
.lead b{color:var(--text)}

.workshopLine{
  margin-top:26px;
  font-size:16px;
  color:rgba(246,246,255,.74);
}

button.primary{
  margin-top:10px;
  border:1px solid rgba(255,43,214,.35);
  background:rgba(255,43,214,.10);
  color:var(--text);
  padding:14px 18px;
  border-radius:14px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:.2s ease;
}
button.primary:hover{background:rgba(255,43,214,.16)}

.links{
  margin-top:32px;
  display:flex;
  gap:26px;
  flex-wrap:wrap;
}
a.link{
  text-decoration:none;
  font-size:16px;
  font-weight:600;
  color:var(--text);
  position:relative;
}
a.link::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-6px;
  width:100%;
  height:2px;
  background:var(--accent2);
  transform:scaleX(0);
  transform-origin:left;
  transition:.25s ease;
}
a.link:hover::after{transform:scaleX(1)}

small{
  display:block;
  margin-top:48px;
  font-size:13px;
  color:rgba(246,246,255,.42);
}

/* Modal */
.overlay{
  position:fixed; inset:0;
  background:rgba(10,10,18,.6);
  backdrop-filter:blur(6px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:50;
}
.overlay.open{display:flex}

.modal{
  width:min(560px, 100%);
  background:#11111b;
  border-radius:20px;
  border:1px solid rgba(255,255,255,.16);
  padding:22px;
  box-shadow:0 26px 80px rgba(0,0,0,.6);
}

.modalRow{
  display:flex;
  gap:24px;
  align-items:center;
}

/* Chibi2 */
.modalChibi{
  width:100px;
  height:100px;
  border-radius:999px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.16);
  flex:0 0 auto;
}
.modalChibi img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.modalContent{
  flex:1;
}

.modal h2{
  margin:0;
  font-size:20px;
}

.modal p{
  margin:10px 0 0;
  font-size:15px;
  color:rgba(246,246,255,.72);
  line-height:1.55;
}

/* White buttons */
.choices{
  margin-top:24px;
  display:grid;
  gap:14px;
}
.choice{
  padding:16px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.3);
  background:#ffffff;
  color:#111;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
  transition:.18s ease;
}
.choice:hover{
  background:#f2f2f2;
  transform:translateY(-1px);
}
</style>
</head>

<body>
<div class="container">
  <div class="hero">
    <div class="chibi">
      <img src="/pic/chibi1.png" alt="Jackie chibi">
    </div>

    <div>
      <h1><span class="highlight">Jackie Foo</span></h1>

      <p class="lead">
        <b>I’m Jackie. This is my corner of the internet.</b> 
        More is coming. Stay tuned.
      </p>

      <div class="workshopLine">
        If you're here for the workshop, click below to indicate.
      </div>
      <button class="primary" id="workshopBtn">Workshop 1</button>

      <div class="links">
        <a class="link" href="#" target="_blank">LinkedIn</a>
        <a class="link" href="#" target="_blank">GitHub</a>
        <a class="link" href="mailto:you@email.com">Email</a>
        <a class="link" href="#" target="_blank">Resume</a>
      </div>

      <small>© <span id="year"></span></small>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modalRow">
      <div class="modalChibi">
        <img src="/pic/chibi2.png" alt="">
      </div>

      <div class="modalContent">
        <h2>Workshop 1</h2>
        <p>Select your university below.</p>
      </div>
    </div>

    <div class="choices">
      <button class="choice" onclick="window.location.href='https://example.com/monash'">
        Monash University
      </button>
      <button class="choice" onclick="window.location.href='https://example.com/upng'">
        UPNG
      </button>
    </div>
  </div>
</div>

<script>
document.getElementById("year").textContent = new Date().getFullYear();

const overlay = document.getElementById("overlay");
document.getElementById("workshopBtn").onclick = () => overlay.classList.add("open");
overlay.onclick = (e) => { if(e.target === overlay) overlay.classList.remove("open"); };
</script>

</body>
</html>
