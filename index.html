<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jackie Foo</title>
  <meta name="description" content="This is my internet corner, a little piece of me." />
  <meta name="theme-color" content="#ffcb79" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg1: #fff4d6;
      --bg2: #ffd992;
      --bg3: #ffbf65;
      --ink: #4a2a12;
      --muted: #6f482a;
      --card: rgba(255, 249, 238, 0.82);
      --line: rgba(74, 42, 18, 0.16);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Manrope", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 16%, rgba(255,255,255,0.6), transparent 36%),
        radial-gradient(circle at 85% 18%, rgba(255,243,212,0.65), transparent 34%),
        linear-gradient(155deg, var(--bg1) 0%, var(--bg2) 52%, var(--bg3) 100%);
      overflow-x: hidden;
    }

    .rain {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 10%, #000 92%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, #000 10%, #000 92%, transparent 100%);
    }

    .drop {
      position: absolute;
      top: -180px;
      left: 0;
      width: var(--size, 80px);
      opacity: var(--op, 0.18);
      animation: fall var(--dur, 14s) linear infinite;
      animation-delay: var(--delay, 0s);
      filter: drop-shadow(0 6px 12px rgba(110, 62, 30, 0.16));
      mix-blend-mode: multiply;
    }

    .drop img {
      width: 100%;
      height: auto;
      display: block;
      transform: scaleX(var(--flip, 1));
      user-select: none;
      -webkit-user-drag: none;
    }

    .page {
      min-height: 100vh;
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      padding: clamp(22px, 4.6vw, 56px);
    }

    .hero {
      width: min(1020px, 100%);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 249, 238, 0.74);
      backdrop-filter: blur(4px);
      box-shadow: 0 12px 30px rgba(88, 49, 24, 0.1);
      padding: clamp(16px, 2.6vw, 28px);
      display: grid;
      grid-template-columns: minmax(200px, 280px) 1fr;
      gap: clamp(18px, 2.8vw, 30px);
      align-items: center;
      position: relative;
    }

    .heroCopy {
      order: 2;
      animation: rise 500ms ease-out both;
    }

    .tag {
      width: fit-content;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 12px;
      background: rgba(255,255,255,0.75);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      position: absolute;
      top: 12px;
      right: 14px;
    }

    .tag::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffc74d;
      box-shadow: 0 0 0 0 rgba(255, 199, 77, 0.58);
      animation: glow 1.8s ease-out infinite;
    }

    h1 {
      margin: 12px 0 0;
      font-size: clamp(1.8rem, 4.8vw, 3.1rem);
      line-height: 1.02;
      letter-spacing: -0.02em;
      max-width: 14ch;
      font-weight: 800;
    }

    .subTitle {
      margin: 10px 0 0;
      max-width: 50ch;
      color: var(--muted);
      font-size: clamp(0.98rem, 1.8vw, 1.06rem);
      line-height: 1.66;
      font-weight: 600;
    }

    .lead {
      margin: 10px 0 0;
      max-width: 55ch;
      color: var(--muted);
      font-size: clamp(0.9rem, 1.55vw, 0.98rem);
      line-height: 1.62;
      font-weight: 500;
    }

    .links {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
    }

    .link {
      color: var(--ink);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 700;
      position: relative;
      transition: color 140ms ease, transform 140ms ease;
      animation: rise 500ms ease-out both;
      padding: 3px 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .link::before {
      content: "↗";
      font-size: 0.74rem;
      color: rgba(74, 42, 18, 0.66);
      transform: translateY(-0.5px);
      transition: color 160ms ease, transform 160ms ease;
    }

    .link::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -3px;
      height: 1px;
      background: currentColor;
      transform: scaleX(0.2);
      transform-origin: left;
      opacity: 0.45;
      transition: transform 160ms ease, opacity 160ms ease;
    }

    .link:hover {
      color: #2e1709;
      transform: translateY(-1px);
    }

    .link:hover::before {
      color: #2e1709;
      transform: translate(1px, -1px);
    }

    .link:hover::after {
      transform: scaleX(1);
      opacity: 1;
    }

    .link:focus-visible {
      outline: 2px solid rgba(46, 23, 9, 0.28);
      outline-offset: 4px;
      border-radius: 4px;
    }

    .workshopWrap {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid rgba(74, 42, 18, 0.2);
      border-radius: 999px;
      padding: 7px 12px;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.65);
      cursor: pointer;
      white-space: nowrap;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(50, 26, 12, 0.12);
    }

    .redirectNote {
      margin: 0;
      color: rgba(74, 42, 18, 0.68);
      font-size: 0.76rem;
      font-weight: 600;
    }

    .profileCol {
      display: grid;
      justify-items: center;
      align-items: center;
      order: 1;
      position: relative;
      z-index: 0;
      animation: rise 540ms ease-out both;
    }

    .picWrap {
      width: clamp(180px, 24vw, 250px);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid var(--line);
      background: linear-gradient(145deg, #fff8ea, #ffe8bf);
      box-shadow: 0 10px 22px rgba(84, 47, 22, 0.14);
      position: relative;
      z-index: 2;
    }

    .picWrap::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.75);
      pointer-events: none;
    }

    .picWrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transform: scale(1.02);
      display: block;
    }

    .profileGlow {
      width: clamp(160px, 22vw, 230px);
      height: clamp(160px, 22vw, 230px);
      border-radius: 50%;
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0));
      position: absolute;
      z-index: 0;
      transform: translateY(8px);
      filter: blur(1px);
    }

    footer {
      margin-top: 12px;
      color: rgba(74, 42, 18, 0.66);
      font-size: 0.79rem;
      font-weight: 700;
    }

    @keyframes fall {
      from {
        transform: translate3d(0, -20vh, 0) rotate(0deg);
      }
      to {
        transform: translate3d(var(--drift, 20px), 128vh, 0) rotate(var(--rot, 9deg));
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes glow {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 199, 77, 0.58);
      }
      100% {
        box-shadow: 0 0 0 9px rgba(255, 199, 77, 0);
      }
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .heroCopy {
        order: 2;
      }

      .profileCol {
        order: 1;
        justify-items: center;
      }

      .tag {
        top: 10px;
        right: 10px;
      }
    }

    @media (max-width: 760px) {
      .workshopWrap {
        align-items: flex-start;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .drop,
      .heroCopy,
      .profileCol,
      .profileGlow,
      .link,
      .btn {
        animation: none;
        transition: none;
      }

      .tag::before {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="rain" class="rain" aria-hidden="true"></div>

  <div class="page">
    <main class="hero" aria-label="Intro">
      <section class="heroCopy">
        <span class="tag">Coming Soon</span>
        <h1>Jackie Foo</h1>
        <p class="subTitle">I am still developing this website, STAY TUNE.</p>
        <p class="lead">I am going to be the villian in everyone's life.</p>

        <nav class="links" aria-label="Profile links">
          <a class="link" href="#" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a class="link" href="#" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a class="link" href="mailto:you@email.com">Email</a>
          <a class="link" href="#" target="_blank" rel="noopener noreferrer">Resume</a>
        </nav>

        <section class="workshopWrap" aria-label="Workshop redirect">
          <button id="openBtn" class="btn" type="button">Go To Workshop</button>
          <p class="redirectNote">Redirects to the Stage 1 workshop page.</p>
        </section>

        <footer>© <span id="year"></span> Jackie Foo</footer>
      </section>

      <section class="profileCol" aria-label="Profile image">
        <div class="profileGlow" aria-hidden="true"></div>
        <figure class="picWrap">
          <img src="/pic/chibi1.png" alt="Jackie chibi portrait" />
        </figure>
      </section>
    </main>
  </div>

  <script>
    (() => {
      const WORKSHOP_LINK = "/stage1/landing.html";

      const year = document.getElementById("year");
      const openBtn = document.getElementById("openBtn");
      const rain = document.getElementById("rain");

      year.textContent = String(new Date().getFullYear());

      function openStage() {
        window.location.href = WORKSHOP_LINK;
      }

      openBtn.addEventListener("click", openStage);

      const count = Math.min(86, Math.max(44, Math.floor(window.innerWidth / 18)));
      for (let i = 0; i < count; i += 1) {
        const drop = document.createElement("div");
        drop.className = "drop";

        const size = 30 + Math.random() * 64;
        drop.style.setProperty("--size", `${size}px`);
        drop.style.left = `${Math.random() * 100}%`;
        drop.style.setProperty("--dur", `${10 + Math.random() * 12}s`);
        drop.style.setProperty("--delay", `${Math.random() * -24}s`);
        drop.style.setProperty("--op", `${0.14 + Math.random() * 0.18}`);
        drop.style.setProperty("--drift", `${-34 + Math.random() * 68}px`);
        drop.style.setProperty("--rot", `${-8 + Math.random() * 16}deg`);
        drop.style.setProperty("--flip", Math.random() > 0.5 ? "-1" : "1");

        const img = document.createElement("img");
        img.src = "/pic/chibi3.png";
        img.alt = "";

        drop.appendChild(img);
        rain.appendChild(drop);
      }
    })();
  </script>
</body>
</html>
