<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Jackie Foo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#07070b;
  --text:#f6f6ff;
  --muted:rgba(246,246,255,.65);
  --accent:#7c5cff;
  --accent2:#ff2bd6;
}

*{box-sizing:border-box}
html,body{height:100%}

body{
  margin:0;
  font-family:"Space Grotesk", sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  overflow-x:hidden;
}

/* Soft glow */
body::before{
  content:"";
  position:fixed;
  inset:-20%;
  background:
    radial-gradient(700px 500px at 20% 10%, rgba(255,43,214,.15), transparent 60%),
    radial-gradient(800px 600px at 80% 20%, rgba(124,92,255,.15), transparent 60%);
  z-index:-1;
}

.container{
  max-width:900px;
  width:100%;
}

/* Layout */
.hero{
  display:flex;
  align-items:center;
  gap:48px;
}

@media (max-width:768px){
  .hero{
    flex-direction:column;
    align-items:flex-start;
    gap:32px;
  }
}

/* Chibi */
.chibi{
  width:clamp(160px, 28vw, 260px);
  aspect-ratio:1/1;
  flex-shrink:0;
}

.chibi img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

/* Typography */
h1{
  font-size:clamp(48px, 8vw, 90px);
  margin:0;
  line-height:.9;
  letter-spacing:-.03em;
}

.highlight{
  position:relative;
  display:inline-block;
}

.highlight::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:8px;
  height:10px;
  background:rgba(124,92,255,.25);
  z-index:-1;
}

p{
  margin:24px 0 0;
  font-size:18px;
  line-height:1.7;
  color:var(--muted);
  max-width:520px;
}

/* Links */
.links{
  margin-top:40px;
  display:flex;
  gap:28px;
  flex-wrap:wrap;
}

a{
  text-decoration:none;
  font-size:16px;
  font-weight:600;
  color:var(--text);
  position:relative;
  transition:.2s ease;
}

a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-6px;
  width:100%;
  height:2px;
  background:var(--accent2);
  transform:scaleX(0);
  transform-origin:left;
  transition:.25s ease;
}

a:hover::after{
  transform:scaleX(1);
}

small{
  display:block;
  margin-top:60px;
  font-size:14px;
  color:rgba(246,246,255,.4);
}
</style>
</head>

<body>

<div class="container">

  <div class="hero">
    <div class="chibi">
      <img src="/pic/chibi1.png" alt="Jackie Chibi">
    </div>

    <div>
      <h1>
        <span class="highlight">Jackie Foo</span>
      </h1>

      <p>
        Soft launch. This site is still developing.
        I’m building it in public and refining it as I go.
      </p>

      <div class="links">
        <a href="#" target="_blank">LinkedIn</a>
        <a href="#" target="_blank">GitHub</a>
        <a href="mailto:you@email.com">Email</a>
        <a href="#" target="_blank">Resume</a>
      </div>
    </div>
  </div>

  <small>
    © <span id="year"></span>
  </small>

</div>

<script>
document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
