<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jackie Foo | Playboard</title>
  <meta name="description" content="Minimal playful board." />
  <meta name="theme-color" content="#d9d6d0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #d9d6d0;
      --paper: #f7f5f0;
      --line: #d9d6d0;
      --ink: #141414;
      --muted: #5b5b5b;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Instrument Sans", sans-serif;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 12px;
    }

    .window {
      width: min(1120px, calc(100vw - 18px));
      border: 1px solid #cbc6bd;
      background: var(--paper);
    }

    .windowBar {
      height: 44px;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 16px;
      font-size: 0.83rem;
      font-weight: 600;
    }

    .barLeft,
    .barRight {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .barRight {
      justify-self: end;
    }

    .brand {
      font-family: "Gaegu", cursive;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .link {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }

    .link:hover {
      border-color: var(--ink);
    }

    .board {
      min-height: min(76vh, 760px);
      display: grid;
      grid-template-rows: 1fr auto;
    }

    .scene {
      position: relative;
      min-height: 510px;
      overflow: hidden;
      padding: clamp(24px, 4vw, 42px) clamp(16px, 3vw, 34px) 10px;
    }

    .title {
      margin: 0;
      text-align: center;
      font-family: "Gaegu", cursive;
      font-size: clamp(2.2rem, 5.3vw, 4.3rem);
      line-height: 0.98;
      letter-spacing: 0.06em;
      font-weight: 700;
      text-transform: uppercase;
    }

    .visualWrap {
      position: absolute;
      left: 50%;
      top: 56%;
      transform: translate(-50%, -50%);
      width: min(72%, 700px);
      max-height: 70%;
      display: grid;
      place-items: center;
      z-index: 2;
      pointer-events: none;
    }

    .visualWrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.1));
    }

    .hint {
      position: absolute;
      top: calc(56% + 180px);
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.76rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.8);
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid #e4dfd7;
      z-index: 3;
    }

    .drawCanvas {
      position: absolute;
      inset: 0;
      z-index: 4;
      cursor: crosshair;
    }

    .bottom {
      border-top: 1px solid var(--line);
      padding: 12px 14px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 14px;
      align-items: end;
    }

    .about h2 {
      margin: 0;
      font-size: clamp(2rem, 3.5vw, 3rem);
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .about p {
      margin: 8px 0 0;
      color: #2f2f2f;
      font-size: 0.9rem;
      line-height: 1.45;
      max-width: 34ch;
    }

    .about a {
      margin-top: 10px;
      display: inline-block;
      color: #111;
      text-decoration: none;
      border-bottom: 1px solid #111;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .controls {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      height: 28px;
      padding: 0 15px;
      border-radius: 999px;
      border: 1px solid #8c8a86;
      background: transparent;
      color: #222;
      font: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn.active {
      background: #1e1e1e;
      border-color: #1e1e1e;
      color: #fff;
    }

    .tools {
      display: inline-flex;
      gap: 14px;
      align-items: center;
      justify-content: flex-end;
    }

    .swatches {
      display: inline-flex;
      gap: 7px;
      align-items: center;
    }

    .swatch {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.28);
      cursor: pointer;
      opacity: 0.88;
      transform: scale(1);
      transition: transform 120ms ease, opacity 120ms ease;
    }

    .swatch.active {
      transform: scale(1.15);
      opacity: 1;
      border-color: rgba(0, 0, 0, 0.62);
    }

    .size {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .size input[type="range"] {
      width: 92px;
      accent-color: #2b775d;
    }

    .size span {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
      color: #4f4e4b;
    }

    @media (max-width: 980px) {
      .bottom {
        grid-template-columns: 1fr;
      }

      .tools {
        justify-content: flex-start;
      }

      .visualWrap {
        width: min(88%, 640px);
      }

      .hint {
        top: calc(56% + 160px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .swatch { transition: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="window" aria-label="Playboard">
      <header class="windowBar">
        <div class="barLeft">
          <a class="link" href="#">Shop</a>
          <a class="link" href="#">Play</a>
        </div>
        <div class="brand">woset</div>
        <div class="barRight">
          <span>Cart (0)</span>
          <a class="link" href="#">Information</a>
        </div>
      </header>

      <div class="board">
        <section id="scene" class="scene">
          <h1 class="title">Jackie has built<br />a tiny home for ideas</h1>

          <div class="visualWrap">
            <img id="mainVisual" src="/pic/chibi5.png" alt="Main illustration" />
          </div>
          <div class="hint">center visual slot (chibi5)</div>

          <canvas id="drawCanvas" class="drawCanvas"></canvas>
        </section>

        <section class="bottom">
          <div class="about">
            <h2>Jackie</h2>
            <p>
              A small and playful corner. Draw, erase, and explore.
              This page is intentionally minimal.
            </p>
            <a href="/index.html">Back to Home</a>
          </div>

          <div class="controls">
            <button id="resetBtn" class="btn" type="button">Start Over</button>
            <button id="eraserBtn" class="btn" type="button">Eraser</button>
            <button id="saveBtn" class="btn" type="button">Save</button>
            <button id="shareBtn" class="btn" type="button">Share</button>
          </div>

          <div class="tools">
            <div id="swatches" class="swatches" aria-label="Color swatches">
              <button class="swatch active" data-color="#a23e52" style="background:#a23e52" aria-label="Rose"></button>
              <button class="swatch" data-color="#4868aa" style="background:#4868aa" aria-label="Blue"></button>
              <button class="swatch" data-color="#4f3f5d" style="background:#4f3f5d" aria-label="Purple"></button>
              <button class="swatch" data-color="#3d6f63" style="background:#3d6f63" aria-label="Green"></button>
              <button class="swatch" data-color="#ccb969" style="background:#ccb969" aria-label="Gold"></button>
            </div>
            <label class="size">
              <span>Brush</span>
              <input id="sizeRange" type="range" min="1" max="14" step="1" value="4" />
            </label>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const mainVisual = document.getElementById("mainVisual");
      mainVisual.addEventListener("error", () => {
        mainVisual.src = "/pic/chibi3.png";
      });

      const scene = document.getElementById("scene");
      const canvas = document.getElementById("drawCanvas");
      const ctx = canvas.getContext("2d");
      const dpr = Math.max(1, window.devicePixelRatio || 1);

      const resetBtn = document.getElementById("resetBtn");
      const eraserBtn = document.getElementById("eraserBtn");
      const saveBtn = document.getElementById("saveBtn");
      const shareBtn = document.getElementById("shareBtn");
      const swatches = document.getElementById("swatches");
      const sizeRange = document.getElementById("sizeRange");

      let drawing = false;
      let erasing = false;
      let lastX = 0;
      let lastY = 0;
      let penColor = "#a23e52";

      function resizeCanvas() {
        const rect = scene.getBoundingClientRect();
        canvas.width = Math.floor(rect.width * dpr);
        canvas.height = Math.floor(rect.height * dpr);
        canvas.style.width = `${rect.width}px`;
        canvas.style.height = `${rect.height}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = penColor;
        ctx.lineWidth = Number(sizeRange.value);
      }

      function drawLine(x, y) {
        ctx.save();
        if (erasing) {
          ctx.globalCompositeOperation = "destination-out";
          ctx.strokeStyle = "rgba(0,0,0,1)";
          ctx.lineWidth = Number(sizeRange.value) * 2;
        } else {
          ctx.globalCompositeOperation = "source-over";
          ctx.strokeStyle = penColor;
          ctx.lineWidth = Number(sizeRange.value);
        }
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.restore();
        lastX = x;
        lastY = y;
      }

      canvas.addEventListener("pointerdown", (event) => {
        drawing = true;
        const rect = scene.getBoundingClientRect();
        lastX = event.clientX - rect.left;
        lastY = event.clientY - rect.top;
      });

      canvas.addEventListener("pointermove", (event) => {
        if (!drawing) return;
        const rect = scene.getBoundingClientRect();
        drawLine(event.clientX - rect.left, event.clientY - rect.top);
      });

      canvas.addEventListener("pointerup", () => { drawing = false; });
      canvas.addEventListener("pointercancel", () => { drawing = false; });
      canvas.addEventListener("pointerleave", () => { drawing = false; });

      resetBtn.addEventListener("click", () => {
        const rect = scene.getBoundingClientRect();
        ctx.clearRect(0, 0, rect.width, rect.height);
        erasing = false;
        eraserBtn.classList.remove("active");
      });

      eraserBtn.addEventListener("click", () => {
        erasing = !erasing;
        eraserBtn.classList.toggle("active", erasing);
      });

      saveBtn.addEventListener("click", () => {
        const link = document.createElement("a");
        link.href = canvas.toDataURL("image/png");
        link.download = "playboard-doodle.png";
        link.click();
      });

      shareBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(location.href);
          shareBtn.textContent = "Copied";
          setTimeout(() => {
            shareBtn.textContent = "Share";
          }, 900);
        } catch (_) {
          // no-op
        }
      });

      swatches.addEventListener("click", (event) => {
        const btn = event.target.closest(".swatch");
        if (!btn) return;
        swatches.querySelectorAll(".swatch").forEach((node) => node.classList.remove("active"));
        btn.classList.add("active");
        penColor = btn.dataset.color || penColor;
      });

      sizeRange.addEventListener("input", () => {
        ctx.lineWidth = Number(sizeRange.value);
      });

      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);
    })();
  </script>
</body>
</html>
