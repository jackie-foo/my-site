<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jackie Foo | Collaboration Board</title>
  <meta name="description" content="Interactive collaboration-style portfolio board." />
  <meta name="theme-color" content="#f2f2f2" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #f2f2f2;
      --ink: #1f1f1f;
      --muted: #606060;
      --line: #dcdcdc;
      --shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
      --soft-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "Manrope", sans-serif;
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 16% 20%, rgba(255, 223, 120, 0.45), transparent 40%),
        radial-gradient(circle at 84% 78%, rgba(255, 153, 195, 0.34), transparent 42%),
        #fffdf6;
      transition: opacity 640ms ease, visibility 640ms ease;
    }

    .loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loaderCard {
      position: relative;
      text-align: center;
      display: grid;
      gap: 10px;
      justify-items: center;
      padding: 16px 18px 14px;
      border: 1px solid rgba(0, 0, 0, 0.07);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 16px 28px rgba(0, 0, 0, 0.1);
    }

    .loaderCard img {
      width: clamp(90px, 14vw, 150px);
      height: auto;
      animation: loadBob 1.2s ease-in-out infinite alternate;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.14));
    }

    .loaderCard h1 {
      margin: 0;
      font-size: clamp(1.3rem, 4vw, 2rem);
      letter-spacing: -0.02em;
    }

    .loaderCard p {
      margin: 0;
      color: #555;
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .dots {
      font-family: "Caveat", cursive;
      font-size: 1.35rem;
      color: #333;
      min-width: 60px;
      text-align: center;
    }

    .loaderMeter {
      width: min(250px, 64vw);
      height: 8px;
      border-radius: 999px;
      background: #f2eee4;
      border: 1px solid #ebdfc2;
      overflow: hidden;
    }

    .loaderMeterBar {
      width: 8%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ffc85d, #ff8f9e);
      transition: width 260ms ease;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 58px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 30;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 800;
      color: #222;
      letter-spacing: 0.01em;
    }

    .brandDot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffcc57;
    }

    .rightControls {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .activeUsers {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
    }

    .activeUsers img {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #f0f0f0;
    }

    .socialFull {
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: #4e4e4e;
      text-decoration: none;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      padding: 0 9px;
      display: inline-flex;
      align-items: center;
      transition: border-color 140ms ease, color 140ms ease;
      cursor: pointer;
    }

    .socialFull:hover {
      border-color: #a8a8a8;
      color: #222;
    }

    .shareBtn {
      border: 1px solid #1f1f1f;
      border-radius: 8px;
      background: #1f1f1f;
      color: #fff;
      height: 30px;
      padding: 0 10px;
      font: inherit;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
    }

    .leftTools {
      position: fixed;
      top: 76px;
      left: 12px;
      width: 44px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--soft-shadow);
      padding: 8px 6px;
      display: grid;
      gap: 8px;
      z-index: 22;
    }

    .toolBtn {
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      background: #fff;
      display: grid;
      place-items: center;
      font-size: 0.76rem;
      font-weight: 800;
      color: #777;
      cursor: pointer;
    }

    .toolBtn.active {
      border-color: #999;
      color: #222;
      background: #f8f8f8;
    }

    .board {
      position: fixed;
      inset: 58px 0 0 0;
      z-index: 10;
      overflow: hidden;
      background:
        linear-gradient(transparent 97%, #e8e8e8 97%),
        linear-gradient(90deg, transparent 97%, #e8e8e8 97%);
      background-size: 34px 34px;
    }

    .world {
      position: absolute;
      inset: 0;
      transform-origin: center center;
      transition: transform 220ms ease;
    }

    .centerCopy {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      z-index: 2;
    }

    .centerCopy h2 {
      margin: 0;
      font-size: clamp(1.7rem, 4.4vw, 3rem);
      letter-spacing: -0.02em;
      color: #2a2a2a;
    }

    .centerCopy span {
      display: block;
      margin-top: 6px;
      font-family: "Caveat", cursive;
      font-size: clamp(1.2rem, 2.9vw, 2rem);
      color: #ff80a7;
    }

    .scribble {
      position: absolute;
      pointer-events: none;
      z-index: 2;
      color: #ff88ad;
      font-family: "Caveat", cursive;
      font-size: 2rem;
      transform: rotate(var(--r, 0deg));
      opacity: 0.86;
    }

    .s1 { left: 14%; top: 14%; --r: -9deg; }
    .s2 { right: 20%; top: 22%; --r: 8deg; }
    .s3 { left: 28%; bottom: 14%; --r: -5deg; }
    .s4 { right: 12%; bottom: 22%; --r: 6deg; }
    .s5 { left: 46%; top: 10%; --r: -3deg; }

    .bgChibi {
      position: absolute;
      width: var(--size, 82px);
      opacity: var(--op, 0.06);
      filter: blur(0.2px);
      pointer-events: none;
      z-index: 1;
      animation: drift var(--dur, 18s) ease-in-out infinite alternate;
    }

    .bgChibi img {
      width: 100%;
      display: block;
      transform: scaleX(var(--flip, 1));
    }

    .notes,
    .cursorLayer,
    .doodleLayer {
      position: absolute;
      inset: 0;
    }

    .doodleLayer {
      z-index: 6;
      pointer-events: none;
    }

    .doodleLayer.drawing {
      pointer-events: auto;
      cursor: crosshair;
    }

    .note {
      position: absolute;
      transform: translate(-50%, -50%);
      width: clamp(170px, 20vw, 230px);
      z-index: 8;
      touch-action: none;
      cursor: grab;
    }

    .noteInner {
      position: relative;
      border-radius: 4px;
      padding: 10px;
      background: var(--note-bg, #ffffff);
      box-shadow: var(--shadow);
      user-select: none;
      transition: box-shadow 130ms ease, transform 130ms ease, opacity 120ms ease;
      transform: rotate(var(--rot, 0deg));
      border: 1px solid rgba(0, 0, 0, 0.06);
      z-index: 0;
      isolation: isolate;
    }

    .noteInner::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: var(--note-layer, #ebebeb);
      transform: translate(5px, 5px);
      z-index: -1;
    }

    .note:hover .noteInner,
    .note.is-paused .noteInner {
      transform: rotate(var(--rot, 0deg)) scale(1.02);
      box-shadow: 0 14px 24px rgba(0, 0, 0, 0.16);
    }

    .note.is-collab .noteInner {
      opacity: 0.52;
    }

    .note.is-dragging {
      cursor: grabbing;
      z-index: 18;
    }

    .note-sm { width: clamp(150px, 16vw, 190px); }
    .note-lg { width: clamp(210px, 23vw, 285px); }
    .note-photo { width: clamp(154px, 17vw, 200px); }

    .note.tone-yellow { --note-bg: #f8efad; --note-layer: #e6d98e; }
    .note.tone-pink { --note-bg: #f8d5e7; --note-layer: #e7b9d3; }
    .note.tone-blue { --note-bg: #cfdcfa; --note-layer: #b6c7eb; }
    .note.tone-green { --note-bg: #d0efbe; --note-layer: #b8dca4; }
    .note.tone-white { --note-bg: #ffffff; --note-layer: #ececec; }

    .pin {
      position: absolute;
      top: -7px;
      right: 10px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #ff5e5e;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
    }

    .tag {
      width: fit-content;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      color: #555;
      padding: 3px 8px;
      font-size: 0.67rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 7px;
    }

    .note h3 {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .note p {
      margin: 8px 0 0;
      color: #343434;
      font-size: 0.85rem;
      line-height: 1.5;
      font-weight: 600;
    }

    .note a {
      display: inline-flex;
      margin-top: 8px;
      color: #1e1e1e;
      font-size: 0.79rem;
      font-weight: 800;
      text-decoration: none;
      border-bottom: 1px solid #888;
      padding-bottom: 2px;
    }

    .note a:hover {
      border-color: #1e1e1e;
    }

    .photo {
      width: 100%;
      border-radius: 3px;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border: 1px solid rgba(0, 0, 0, 0.1);
      margin-top: 6px;
    }

    .collabCursor {
      position: absolute;
      z-index: 12;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      pointer-events: none;
      transition: opacity 120ms ease;
    }

    .cursorArrow {
      width: 12px;
      height: 12px;
      background: #3f3f3f;
      clip-path: polygon(0 0, 100% 50%, 0 100%, 18% 56%, 0 0);
      transform: rotate(-20deg);
    }

    .cursorTag {
      border-radius: 999px;
      background: #222;
      color: #fff;
      padding: 3px 8px;
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .collabCursor.over {
      opacity: 0.28;
    }

    .zoomPanel {
      position: absolute;
      right: 14px;
      top: 16px;
      width: clamp(180px, 21vw, 250px);
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--soft-shadow);
      z-index: 14;
      overflow: hidden;
    }

    .zoomHead {
      padding: 8px 10px;
      border-bottom: 1px solid #ececec;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #666;
    }

    .zoomTiles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: #ececec;
    }

    .tile {
      background: #fff;
      aspect-ratio: 1.1 / 1;
      overflow: hidden;
      position: relative;
    }

    .tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .tile span {
      position: absolute;
      left: 6px;
      bottom: 6px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font-size: 0.63rem;
      font-weight: 700;
      border-radius: 4px;
      padding: 2px 5px;
    }

    .commentPanel {
      position: fixed;
      right: 14px;
      top: 64px;
      width: min(300px, calc(100vw - 24px));
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: var(--soft-shadow);
      z-index: 35;
      padding: 10px;
      display: grid;
      gap: 8px;
      transform: translateY(-10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .commentPanel.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .commentPanel h3 {
      margin: 0;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #555;
    }

    .commentPanel p {
      margin: 0;
      font-size: 0.74rem;
      color: #666;
      font-weight: 700;
    }

    .field,
    .area,
    .select {
      width: 100%;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font: inherit;
      font-size: 0.84rem;
      padding: 8px 9px;
      color: #222;
      background: #fff;
    }

    .area {
      resize: vertical;
      min-height: 72px;
      max-height: 180px;
    }

    .commentBtn {
      border: 1px solid #222;
      border-radius: 8px;
      background: #222;
      color: #fff;
      font: inherit;
      font-size: 0.74rem;
      font-weight: 800;
      padding: 7px 10px;
      cursor: pointer;
    }

    .commentList {
      max-height: 160px;
      overflow: auto;
      border-top: 1px solid #eee;
      padding-top: 8px;
      display: grid;
      gap: 6px;
    }

    .commentItem {
      border: 1px solid #efefef;
      border-radius: 8px;
      padding: 7px;
      background: #fff;
    }

    .commentItem b {
      font-size: 0.77rem;
    }

    .commentItem span {
      display: block;
      margin-top: 3px;
      font-size: 0.8rem;
      color: #424242;
      line-height: 1.45;
    }

    .zoomDock {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 40;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: var(--soft-shadow);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px;
    }

    .zoomBtn {
      width: 28px;
      height: 28px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background: #fff;
      color: #494949;
      font-size: 1rem;
      line-height: 1;
      font-weight: 800;
      cursor: pointer;
    }

    .zoomLabel {
      min-width: 56px;
      text-align: center;
      font-size: 0.78rem;
      font-weight: 800;
      color: #4a4a4a;
      padding: 0 6px;
      transition: transform 180ms ease;
    }

    .zoomLabel.bump {
      transform: scale(1.08);
    }

    @keyframes loadBob {
      from { transform: translateY(-4px) rotate(-2deg); }
      to { transform: translateY(4px) rotate(2deg); }
    }

    @keyframes drift {
      from { transform: translate3d(0, 0, 0) rotate(0deg); }
      to { transform: translate3d(var(--dx, 10px), var(--dy, -12px), 0) rotate(var(--dr, 4deg)); }
    }

    @media (max-width: 980px) {
      .socialFull:nth-child(2),
      .socialFull:nth-child(3) {
        display: none;
      }
    }

    @media (max-width: 860px) {
      .leftTools,
      .zoomPanel,
      .commentPanel {
        display: none;
      }
      .note { width: clamp(160px, 44vw, 220px); }
      .note-sm { width: clamp(146px, 38vw, 184px); }
      .note-lg { width: clamp(190px, 52vw, 260px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bgChibi,
      .noteInner,
      .zoomLabel,
      .loaderCard img {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="loader" class="loader" aria-hidden="true">
    <div class="loaderCard">
      <img src="/pic/chibi3.png" alt="Loading" />
      <h1>Loading Board</h1>
      <p>warming up tiny sticky chaos</p>
      <div id="dots" class="dots">.</div>
      <div class="loaderMeter" aria-hidden="true">
        <div id="loaderMeterBar" class="loaderMeterBar"></div>
      </div>
    </div>
  </div>

  <header class="topbar">
    <div class="brand"><span class="brandDot"></span>jackie board</div>
    <div class="rightControls" title="hover cursor over notes to signal collaboration">
      <div class="activeUsers" title="Active collaborators">
        <img src="/pic/chibi1.png" alt="active 1" />
        <img src="/pic/chibi2.png" alt="active 2" />
        <img src="/pic/chibi3.png" alt="active 3" />
        <img src="/pic/chibi1.png" alt="active 4" />
      </div>
      <a class="socialFull" href="#" aria-label="LinkedIn">LinkedIn</a>
      <a class="socialFull" href="#" aria-label="GitHub">GitHub</a>
      <a class="socialFull" href="mailto:you@email.com" aria-label="Email">Email</a>
      <button id="commentToggle" class="socialFull" type="button">Comment Sticky</button>
      <button class="shareBtn" type="button">Share</button>
    </div>
  </header>

  <aside id="commentPanel" class="commentPanel" aria-label="Comment panel">
    <h3>Add Sticky Comment</h3>
    <p>Temporary only. Resets on refresh.</p>
    <input id="commentName" class="field" type="text" placeholder="Your name" />
    <textarea id="commentText" class="area" placeholder="Write something funny/useful..."></textarea>
    <select id="commentTone" class="select">
      <option value="tone-yellow">Yellow</option>
      <option value="tone-pink">Pink</option>
      <option value="tone-blue">Blue</option>
      <option value="tone-green">Green</option>
      <option value="tone-white">White</option>
    </select>
    <button id="commentSubmit" class="commentBtn" type="button">Add As Sticky</button>
    <div id="commentList" class="commentList"></div>
  </aside>

  <aside class="leftTools" aria-hidden="true">
    <button id="drawToggle" class="toolBtn" type="button">✎</button>
    <button id="clearDoodle" class="toolBtn" type="button">⌫</button>
    <div class="toolBtn">T</div>
    <div class="toolBtn">□</div>
    <div class="toolBtn">⋯</div>
  </aside>

  <main id="board" class="board">
    <div id="world" class="world">
      <div class="centerCopy">
        <h2>Let&apos;s explore</h2>
        <span>catch a card to start</span>
      </div>

      <div class="scribble s1">✦</div>
      <div class="scribble s2">✋</div>
      <div class="scribble s3">↯</div>
      <div class="scribble s4">✸</div>
      <div class="scribble s5">➰</div>

      <canvas id="doodleLayer" class="doodleLayer"></canvas>
      <section id="notesLayer" class="notes"></section>
      <section id="cursorLayer" class="cursorLayer"></section>

      <aside class="zoomPanel" aria-hidden="true">
        <div class="zoomHead">Live Collaboration</div>
        <div class="zoomTiles">
          <div class="tile"><img src="/pic/chibi1.png" alt="participant" /><span>Thanish</span></div>
          <div class="tile"><img src="/pic/chibi2.png" alt="participant" /><span>Nevin</span></div>
          <div class="tile"><img src="/pic/chibi3.png" alt="participant" /><span>Shen</span></div>
          <div class="tile"><img src="/pic/chibi1.png" alt="participant" /><span>Samantha</span></div>
        </div>
      </aside>
    </div>
  </main>

  <div class="zoomDock">
    <button id="zoomOut" class="zoomBtn" type="button" aria-label="Zoom out">-</button>
    <div id="zoomLabel" class="zoomLabel">100%</div>
    <button id="zoomIn" class="zoomBtn" type="button" aria-label="Zoom in">+</button>
  </div>

  <script>
    (() => {
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const loader = document.getElementById("loader");
      const dots = document.getElementById("dots");
      const loaderMeterBar = document.getElementById("loaderMeterBar");

      const board = document.getElementById("board");
      const world = document.getElementById("world");
      const notesLayer = document.getElementById("notesLayer");
      const cursorLayer = document.getElementById("cursorLayer");
      const doodleLayer = document.getElementById("doodleLayer");

      const zoomLabel = document.getElementById("zoomLabel");
      const zoomIn = document.getElementById("zoomIn");
      const zoomOut = document.getElementById("zoomOut");

      const drawToggle = document.getElementById("drawToggle");
      const clearDoodle = document.getElementById("clearDoodle");

      const commentToggle = document.getElementById("commentToggle");
      const commentPanel = document.getElementById("commentPanel");
      const commentName = document.getElementById("commentName");
      const commentText = document.getElementById("commentText");
      const commentTone = document.getElementById("commentTone");
      const commentSubmit = document.getElementById("commentSubmit");
      const commentList = document.getElementById("commentList");

      let dotCount = 1;
      const dotTimer = setInterval(() => {
        dotCount = dotCount % 3 + 1;
        dots.textContent = "✦".repeat(dotCount);
      }, 380);

      let loadPct = 8;
      const loadTimer = setInterval(() => {
        loadPct = Math.min(96, loadPct + 4 + Math.random() * 14);
        loaderMeterBar.style.width = `${loadPct}%`;
      }, 200);

      setTimeout(() => {
        loadPct = 100;
        loaderMeterBar.style.width = "100%";
        loader.classList.add("hide");
        clearInterval(dotTimer);
        clearInterval(loadTimer);
      }, 1850);

      let zoom = 1;
      function applyZoom() {
        world.style.transform = `scale(${zoom})`;
        zoomLabel.textContent = `${Math.round(zoom * 100)}%`;
        zoomLabel.classList.remove("bump");
        void zoomLabel.offsetWidth;
        zoomLabel.classList.add("bump");
        layoutStaticNotes();
        layoutCursors();
        resizeCanvas();
      }

      zoomIn.addEventListener("click", () => {
        zoom = Math.min(1.35, zoom + 0.05);
        applyZoom();
      });

      zoomOut.addEventListener("click", () => {
        zoom = Math.max(0.8, zoom - 0.05);
        applyZoom();
      });

      const notesData = [
        {
          tone: "tone-yellow",
          size: "note-lg",
          tag: "About Me",
          title: "Jackie Foo",
          text: "I design learning experiences and implementation systems that help people act on feedback clearly.",
          x: 0.18,
          y: 0.22,
          rot: -2,
          photo: "/pic/chibi1.png"
        },
        {
          tone: "tone-pink",
          size: "note",
          tag: "Project 01",
          title: "Feedback Workshop",
          text: "Interactive workshop design for reflection and action.",
          href: "/project-view.html?project=1",
          x: 0.4,
          y: 0.15,
          rot: 3
        },
        {
          tone: "tone-green",
          size: "note-sm",
          tag: "Project 02",
          title: "Journey Mapping Tool",
          text: "Prompt-first mapping for student/tutor friction.",
          href: "/project-view.html?project=2",
          x: 0.64,
          y: 0.17,
          rot: -4
        },
        {
          tone: "tone-blue",
          size: "note",
          tag: "Project 03",
          title: "Live Dashboard",
          text: "Multi-stage monitoring and cleaner workshop flow.",
          href: "/project-view.html?project=3",
          x: 0.74,
          y: 0.49,
          rot: 2
        },
        {
          tone: "tone-yellow",
          size: "note-sm",
          tag: "Project 04",
          title: "Tutor Workflow",
          text: "Flow-based marking map with practical constraints.",
          href: "/project-view.html?project=4",
          x: 0.53,
          y: 0.69,
          rot: 1
        },
        {
          tone: "tone-white",
          size: "note-photo",
          tag: "Photo",
          title: "Behind The Scenes",
          text: "",
          x: 0.27,
          y: 0.58,
          rot: -3,
          photo: "/pic/chibi2.png"
        },
        {
          tone: "tone-green",
          size: "note-sm",
          tag: "Prompt",
          title: "Hi you 👀",
          text: "Why are you here? Are you offering me snacks, coffee, or brilliant feedback?",
          x: 0.12,
          y: 0.73,
          rot: -6
        }
      ];

      const noteStates = [];
      function createNote(item) {
        const note = document.createElement("article");
        note.className = `note ${item.tone} ${item.size || ""}`;
        note.style.left = `${item.x * 100}%`;
        note.style.top = `${item.y * 100}%`;
        note.style.setProperty("--rot", `${item.rot || 0}deg`);

        note.innerHTML = `
          <div class="noteInner">
            <div class="pin"></div>
            <div class="tag">${item.tag}</div>
            <h3>${item.title}</h3>
            ${item.text ? `<p>${item.text}</p>` : ""}
            ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener noreferrer">Open project</a>` : ""}
            ${item.photo ? `<img class="photo" src="${item.photo}" alt="placeholder" />` : ""}
          </div>
        `;

        notesLayer.appendChild(note);

        const state = {
          el: note,
          xPct: item.x,
          yPct: item.y,
          x: 0,
          y: 0,
          w: 0,
          h: 0,
          collab: false,
          drag: false
        };

        attachDrag(state);
        noteStates.push(state);
        return state;
      }

      function attachDrag(state) {
        const note = state.el;
        let startX = 0;
        let startY = 0;
        note.addEventListener("pointerdown", (event) => {
          if (drawMode) return;
          if (event.button !== 0) return;
          state.drag = true;
          startX = event.clientX;
          startY = event.clientY;
          note.classList.add("is-paused");
          note.classList.add("is-dragging");
          note.setPointerCapture(event.pointerId);
        });

        note.addEventListener("pointermove", (event) => {
          if (!state.drag) return;
          const travel = Math.hypot(event.clientX - startX, event.clientY - startY);
          if (travel > 2) event.preventDefault();
          const rect = board.getBoundingClientRect();
          const localX = (event.clientX - rect.left) / zoom;
          const localY = (event.clientY - rect.top) / zoom;
          state.x = localX - state.w / 2;
          state.y = localY - state.h / 2;
          clamp(state, rect.width / zoom, rect.height / zoom);
          renderNote(state);
        });

        note.addEventListener("pointerup", (event) => {
          if (!state.drag) return;
          state.drag = false;
          note.classList.remove("is-paused");
          note.classList.remove("is-dragging");
          try { note.releasePointerCapture(event.pointerId); } catch (_) {}

          const rect = board.getBoundingClientRect();
          state.xPct = (state.x + state.w / 2) / (rect.width / zoom);
          state.yPct = (state.y + state.h / 2) / (rect.height / zoom);
        });

        note.addEventListener("pointercancel", () => {
          state.drag = false;
          note.classList.remove("is-paused");
          note.classList.remove("is-dragging");
        });

        note.addEventListener("mouseenter", () => note.classList.add("is-paused"));
        note.addEventListener("mouseleave", () => {
          if (!state.drag) note.classList.remove("is-paused");
        });
      }

      notesData.forEach(createNote);

      const collaborators = [
        { name: "thanish", color: "#242424", x: 0.18, y: 0.3, vx: 12, vy: 10 },
        { name: "nevin", color: "#3a5fe8", x: 0.44, y: 0.46, vx: -11, vy: 9 },
        { name: "shen", color: "#d34f84", x: 0.72, y: 0.28, vx: 10, vy: -11 },
        { name: "samantha", color: "#1f8f62", x: 0.64, y: 0.62, vx: -9, vy: -8 }
      ];

      const cursorStates = collaborators.map((item) => {
        const el = document.createElement("div");
        el.className = "collabCursor";
        el.innerHTML = `<span class="cursorArrow"></span><span class="cursorTag">${item.name}</span>`;
        el.querySelector(".cursorTag").style.background = item.color;
        cursorLayer.appendChild(el);

        return {
          el,
          xPct: item.x,
          yPct: item.y,
          x: 0,
          y: 0,
          vx: item.vx,
          vy: item.vy,
          w: 0,
          h: 0
        };
      });

      function renderNote(state) {
        state.el.style.left = `${((state.x + state.w / 2) / (board.getBoundingClientRect().width / zoom)) * 100}%`;
        state.el.style.top = `${((state.y + state.h / 2) / (board.getBoundingClientRect().height / zoom)) * 100}%`;
      }

      function renderCursor(state) {
        state.el.style.transform = `translate3d(${state.x}px, ${state.y}px, 0)`;
      }

      function clamp(state, width, height) {
        const pad = 4;
        state.x = Math.max(pad, Math.min(state.x, width - state.w - pad));
        state.y = Math.max(pad, Math.min(state.y, height - state.h - pad));
      }

      function intersects(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function layoutStaticNotes() {
        const rect = board.getBoundingClientRect();
        const w = rect.width / zoom;
        const h = rect.height / zoom;

        noteStates.forEach((state) => {
          const nRect = state.el.getBoundingClientRect();
          state.w = nRect.width / zoom;
          state.h = nRect.height / zoom;
          state.x = w * state.xPct - state.w / 2;
          state.y = h * state.yPct - state.h / 2;
          clamp(state, w, h);
          renderNote(state);
        });
      }

      function layoutCursors() {
        const rect = board.getBoundingClientRect();
        const w = rect.width / zoom;
        const h = rect.height / zoom;

        cursorStates.forEach((cursor) => {
          const cRect = cursor.el.getBoundingClientRect();
          cursor.w = cRect.width / zoom;
          cursor.h = cRect.height / zoom;
          cursor.x = w * cursor.xPct;
          cursor.y = h * cursor.yPct;
          clamp(cursor, w, h);
          renderCursor(cursor);
        });
      }

      // Comment sticky (in-memory only)
      const comments = [];
      function renderComments() {
        if (!comments.length) {
          commentList.innerHTML = '<div class="commentItem"><b>No comments yet</b><span>Drop something silly/useful and we pin it.</span></div>';
          return;
        }
        commentList.innerHTML = comments
          .slice()
          .reverse()
          .map((item) => `<div class="commentItem"><b>${item.name}</b><span>${item.text}</span></div>`)
          .join("");
      }

      commentToggle.addEventListener("click", () => {
        commentPanel.classList.toggle("open");
      });

      commentSubmit.addEventListener("click", () => {
        const name = (commentName.value || "Anonymous").trim() || "Anonymous";
        const text = (commentText.value || "").trim();
        const tone = commentTone.value || "tone-yellow";
        if (!text) return;

        comments.push({ name, text });
        renderComments();

        const rect = board.getBoundingClientRect();
        const w = rect.width / zoom;
        const h = rect.height / zoom;
        const x = Math.min(0.86, Math.max(0.14, 0.48 + (Math.random() * 0.22 - 0.11)));
        const y = Math.min(0.86, Math.max(0.14, 0.5 + (Math.random() * 0.22 - 0.11)));

        const sticky = {
          tone,
          size: "note-sm",
          tag: "Comment",
          title: name,
          text,
          x,
          y,
          rot: -6 + Math.random() * 12
        };

        createNote(sticky);
        layoutStaticNotes();

        commentText.value = "";
      });

      renderComments();

      // Doodle tool
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const ctx = doodleLayer.getContext("2d");
      let drawMode = false;
      let drawing = false;
      let lastX = 0;
      let lastY = 0;

      function resizeCanvas() {
        const rect = board.getBoundingClientRect();
        doodleLayer.width = Math.floor(rect.width * dpr);
        doodleLayer.height = Math.floor(rect.height * dpr);
        doodleLayer.style.width = `${rect.width}px`;
        doodleLayer.style.height = `${rect.height}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineWidth = 2.4;
        ctx.strokeStyle = "#ff7ea8";
      }

      drawToggle.addEventListener("click", () => {
        drawMode = !drawMode;
        drawToggle.classList.toggle("active", drawMode);
        doodleLayer.classList.toggle("drawing", drawMode);
      });

      clearDoodle.addEventListener("click", () => {
        const rect = board.getBoundingClientRect();
        ctx.clearRect(0, 0, rect.width, rect.height);
      });

      doodleLayer.addEventListener("pointerdown", (event) => {
        if (!drawMode) return;
        drawing = true;
        const rect = board.getBoundingClientRect();
        lastX = event.clientX - rect.left;
        lastY = event.clientY - rect.top;
      });

      doodleLayer.addEventListener("pointermove", (event) => {
        if (!drawMode || !drawing) return;
        const rect = board.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(x, y);
        ctx.stroke();
        lastX = x;
        lastY = y;
      });

      doodleLayer.addEventListener("pointerup", () => {
        drawing = false;
      });
      doodleLayer.addEventListener("pointercancel", () => {
        drawing = false;
      });

      let prev = performance.now();
      function loop(now) {
        const dt = Math.min(0.034, (now - prev) / 1000);
        prev = now;

        if (!reducedMotion) {
          const rect = board.getBoundingClientRect();
          const w = rect.width / zoom;
          const h = rect.height / zoom;

          noteStates.forEach((state) => {
            state.collab = false;
          });

          cursorStates.forEach((cursor) => {
            cursor.x += cursor.vx * dt;
            cursor.y += cursor.vy * dt;

            if (cursor.x <= 2 || cursor.x + cursor.w >= w - 2) {
              cursor.vx *= -1;
              cursor.x = Math.max(2, Math.min(cursor.x, w - cursor.w - 2));
            }
            if (cursor.y <= 2 || cursor.y + cursor.h >= h - 2) {
              cursor.vy *= -1;
              cursor.y = Math.max(2, Math.min(cursor.y, h - cursor.h - 2));
            }

            const cBox = { x: cursor.x, y: cursor.y, w: cursor.w, h: cursor.h };
            let over = false;
            noteStates.forEach((state) => {
              const sBox = { x: state.x, y: state.y, w: state.w, h: state.h };
              if (intersects(cBox, sBox)) {
                over = true;
                state.collab = true;
              }
            });

            cursor.el.classList.toggle("over", over);
            renderCursor(cursor);
          });

          noteStates.forEach((state) => {
            state.el.classList.toggle("is-collab", state.collab);
          });
        }

        requestAnimationFrame(loop);
      }

      // subtle background chibi
      const bgCount = Math.min(8, Math.max(3, Math.floor(window.innerWidth / 260)));
      for (let i = 0; i < bgCount; i += 1) {
        const ghost = document.createElement("div");
        ghost.className = "bgChibi";
        ghost.style.left = `${Math.random() * 100}%`;
        ghost.style.top = `${Math.random() * 100}%`;
        ghost.style.setProperty("--size", `${60 + Math.random() * 90}px`);
        ghost.style.setProperty("--op", `${0.03 + Math.random() * 0.06}`);
        ghost.style.setProperty("--dur", `${15 + Math.random() * 18}s`);
        ghost.style.setProperty("--dx", `${-18 + Math.random() * 36}px`);
        ghost.style.setProperty("--dy", `${-20 + Math.random() * 40}px`);
        ghost.style.setProperty("--dr", `${-5 + Math.random() * 10}deg`);
        ghost.style.setProperty("--flip", Math.random() > 0.5 ? "-1" : "1");

        const img = document.createElement("img");
        img.src = "/pic/chibi3.png";
        img.alt = "";
        ghost.appendChild(img);
        world.appendChild(ghost);
      }

      applyZoom();
      requestAnimationFrame(() => {
        layoutStaticNotes();
        layoutCursors();
        resizeCanvas();
        requestAnimationFrame(loop);
      });

      window.addEventListener("resize", () => {
        layoutStaticNotes();
        layoutCursors();
        resizeCanvas();
      });
    })();
  </script>
