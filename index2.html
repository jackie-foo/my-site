<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jackie Foo | Board</title>
  <meta name="description" content="Interactive board-style portfolio." />
  <meta name="theme-color" content="#f3f3f3" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #f2f2f2;
      --ink: #1f1f1f;
      --muted: #595959;
      --line: #dddddd;
      --white: #ffffff;
      --shadow: 0 10px 18px rgba(0, 0, 0, 0.12);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Manrope", sans-serif;
      color: var(--ink);
      background: var(--bg);
      overflow: hidden;
    }

    .splash {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background: #fff;
      transition: opacity 680ms ease, visibility 680ms ease;
    }

    .splash h1 {
      margin: 0;
      font-size: clamp(3.8rem, 14vw, 11rem);
      line-height: 0.9;
      letter-spacing: -0.06em;
      color: #111;
    }

    .splash.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 20;
      backdrop-filter: blur(3px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 800;
      color: #2a2a2a;
    }

    .brandDot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffcd59;
    }

    .topHint {
      font-size: 0.78rem;
      font-weight: 700;
      color: #6a6a6a;
      letter-spacing: 0.02em;
    }

    .tools {
      position: fixed;
      top: 74px;
      left: 12px;
      width: 42px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.94);
      padding: 8px 6px;
      display: grid;
      gap: 8px;
      z-index: 15;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
    }

    .tool {
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 1px solid #e2e2e2;
      border-radius: 8px;
      background: #fff;
      display: grid;
      place-items: center;
      color: #777;
      font-size: 0.76rem;
      font-weight: 800;
    }

    .chibi-layer {
      position: fixed;
      inset: 56px 0 0 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.38;
    }

    .chibi-float {
      position: absolute;
      width: var(--size, 86px);
      opacity: var(--op, 0.09);
      animation: drift var(--dur, 20s) ease-in-out infinite alternate;
      filter: blur(0.2px);
    }

    .chibi-float img {
      width: 100%;
      display: block;
      transform: scaleX(var(--flip, 1));
    }

    .board {
      position: fixed;
      inset: 56px 0 0 0;
      z-index: 5;
      overflow: hidden;
      background:
        linear-gradient(transparent 97%, #e8e8e8 97%),
        linear-gradient(90deg, transparent 97%, #e8e8e8 97%);
      background-size: 34px 34px;
    }

    .centerLine {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      z-index: 2;
    }

    .centerLine h2 {
      margin: 0;
      font-size: clamp(1.7rem, 4.4vw, 3rem);
      letter-spacing: -0.02em;
    }

    .centerLine span {
      display: block;
      margin-top: 5px;
      font-family: "Caveat", cursive;
      font-size: clamp(1.1rem, 2.8vw, 1.8rem);
      color: #ff7ea8;
    }

    .node {
      position: absolute;
      width: clamp(170px, 19vw, 230px);
      border-radius: 4px;
      padding: 10px;
      box-shadow: var(--shadow);
      user-select: none;
      touch-action: none;
      cursor: grab;
      z-index: 10;
      transition: transform 130ms ease, box-shadow 130ms ease;
    }

    .node:hover,
    .node.is-paused {
      transform: scale(1.02);
      box-shadow: 0 14px 22px rgba(0, 0, 0, 0.16);
    }

    .sticky-yellow { background: #f7efad; }
    .sticky-pink { background: #f8d6e7; }
    .sticky-blue { background: #cfdcfa; }
    .sticky-green { background: #cfeebd; }
    .sticky-white { background: #ffffff; }

    .nodeTag {
      width: fit-content;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 0.67rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: rgba(255, 255, 255, 0.8);
      color: #555;
      margin-bottom: 7px;
    }

    .node h3 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .node p {
      margin: 8px 0 0;
      font-size: 0.86rem;
      line-height: 1.5;
      color: #343434;
      font-weight: 600;
    }

    .node a {
      display: inline-flex;
      margin-top: 8px;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 800;
      color: #1e1e1e;
      border-bottom: 1px solid #888;
      padding-bottom: 2px;
    }

    .node a:hover {
      border-color: #1e1e1e;
    }

    .pin {
      position: absolute;
      top: -7px;
      right: 10px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #ff5a5a;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
    }

    .introCard {
      width: clamp(220px, 24vw, 280px);
    }

    .avatar {
      width: 100%;
      border-radius: 3px;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border: 1px solid rgba(0, 0, 0, 0.1);
      margin-top: 6px;
    }

    .draw {
      position: absolute;
      pointer-events: none;
      z-index: 3;
      color: #ff7ea8;
      font-family: "Caveat", cursive;
      font-size: 2rem;
      transform: rotate(var(--r, 0deg));
      opacity: 0.9;
    }

    .d1 { left: 14%; top: 18%; --r: -10deg; }
    .d2 { right: 20%; top: 22%; --r: 8deg; }
    .d3 { left: 28%; bottom: 17%; --r: -4deg; }

    @keyframes drift {
      from { transform: translate3d(0, 0, 0) rotate(0deg); }
      to { transform: translate3d(var(--dx, 10px), var(--dy, -12px), 0) rotate(var(--dr, 4deg)); }
    }

    @media (max-width: 760px) {
      .tools { display: none; }
      .node { width: clamp(160px, 46vw, 220px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .chibi-float,
      .node {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <h1>404</h1>
  </div>

  <header class="topbar">
    <div class="brand"><span class="brandDot"></span>jackie board</div>
    <div class="topHint">drag notes • hover to pause</div>
  </header>

  <aside class="tools" aria-hidden="true">
    <div class="tool">↖</div>
    <div class="tool">T</div>
    <div class="tool">□</div>
    <div class="tool">✎</div>
    <div class="tool">⋯</div>
  </aside>

  <div id="chibiLayer" class="chibi-layer" aria-hidden="true"></div>

  <main id="board" class="board">
    <div class="centerLine">
      <h2>Let&apos;s explore</h2>
      <span>catch a card to begin</span>
    </div>
    <div class="draw d1">✦</div>
    <div class="draw d2">✋</div>
    <div class="draw d3">↯</div>
  </main>

  <script>
    (() => {
      const board = document.getElementById("board");
      const splash = document.getElementById("splash");
      const chibiLayer = document.getElementById("chibiLayer");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      setTimeout(() => {
        splash.classList.add("hide");
      }, 1500);

      const notesData = [
        {
          kind: "intro",
          tone: "sticky-yellow",
          tag: "About Me",
          title: "Jackie Foo",
          text: "I design learning experiences and implementation systems that help people act on feedback clearly.",
          x: 0.14,
          y: 0.2,
          vx: 9,
          vy: 12,
          extra: "image"
        },
        {
          kind: "project",
          tone: "sticky-pink",
          tag: "Project 01",
          title: "Feedback Workshop",
          text: "Interactive workshop design for reflection and action.",
          href: "#",
          x: 0.36,
          y: 0.13,
          vx: -13,
          vy: 11
        },
        {
          kind: "project",
          tone: "sticky-green",
          tag: "Project 02",
          title: "Journey Mapping Tool",
          text: "Prompt-first mapping tool for student/tutor friction.",
          href: "#",
          x: 0.63,
          y: 0.17,
          vx: 14,
          vy: -8
        },
        {
          kind: "project",
          tone: "sticky-blue",
          tag: "Project 03",
          title: "Live Dashboard",
          text: "Multi-stage monitoring with cleaner workshop orchestration.",
          href: "#",
          x: 0.72,
          y: 0.48,
          vx: -11,
          vy: 9
        },
        {
          kind: "project",
          tone: "sticky-white",
          tag: "Project 04",
          title: "Tutor Workflow",
          text: "Flow-based marking map with practical constraints.",
          href: "#",
          x: 0.23,
          y: 0.55,
          vx: 10,
          vy: 8
        },
        {
          kind: "project",
          tone: "sticky-yellow",
          tag: "Project 05",
          title: "Prompted Notes",
          text: "Sticky-note strategy to surface deeper reflection.",
          href: "#",
          x: 0.52,
          y: 0.66,
          vx: -8,
          vy: -12
        },
        {
          kind: "project",
          tone: "sticky-pink",
          tag: "Project 06",
          title: "Portfolio Narrative",
          text: "Story-driven portfolio experiments with interaction.",
          href: "#",
          x: 0.8,
          y: 0.72,
          vx: 8,
          vy: -9
        }
      ];

      const states = notesData.map((item) => {
        const note = document.createElement("article");
        note.className = `node ${item.tone}${item.kind === "intro" ? " introCard" : ""}`;
        note.innerHTML = `
          <div class="pin"></div>
          <div class="nodeTag">${item.tag}</div>
          <h3>${item.title}</h3>
          <p>${item.text}</p>
          ${item.href ? `<a href="${item.href}" target="_blank" rel="noopener noreferrer">Open project</a>` : ""}
          ${item.extra === "image" ? '<img class="avatar" src="/pic/chibi1.png" alt="Jackie" />' : ""}
        `;
        board.appendChild(note);

        const state = {
          el: note,
          xPct: item.x,
          yPct: item.y,
          x: 0,
          y: 0,
          w: 0,
          h: 0,
          vx: item.vx,
          vy: item.vy,
          pause: false,
          drag: false
        };

        note.addEventListener("mouseenter", () => {
          state.pause = true;
          note.classList.add("is-paused");
        });

        note.addEventListener("mouseleave", () => {
          if (!state.drag) {
            state.pause = false;
            note.classList.remove("is-paused");
          }
        });

        note.addEventListener("pointerdown", (event) => {
          state.drag = true;
          state.pause = true;
          note.classList.add("is-paused");
          note.setPointerCapture(event.pointerId);
        });

        note.addEventListener("pointermove", (event) => {
          if (!state.drag) return;
          const rect = board.getBoundingClientRect();
          state.x = event.clientX - rect.left - state.w / 2;
          state.y = event.clientY - rect.top - state.h / 2;
          clamp(state, rect.width, rect.height);
          render(state);
        });

        note.addEventListener("pointerup", (event) => {
          state.drag = false;
          state.pause = false;
          note.classList.remove("is-paused");
          try { note.releasePointerCapture(event.pointerId); } catch (_) {}
        });

        note.addEventListener("pointercancel", () => {
          state.drag = false;
          state.pause = false;
          note.classList.remove("is-paused");
        });

        return state;
      });

      function render(state) {
        state.el.style.transform = `translate3d(${state.x}px, ${state.y}px, 0)`;
      }

      function clamp(state, width, height) {
        const pad = 4;
        state.x = Math.max(pad, Math.min(state.x, width - state.w - pad));
        state.y = Math.max(pad, Math.min(state.y, height - state.h - pad));
      }

      function initialLayout() {
        const rect = board.getBoundingClientRect();
        states.forEach((state) => {
          const nRect = state.el.getBoundingClientRect();
          state.w = nRect.width;
          state.h = nRect.height;
          state.x = rect.width * state.xPct;
          state.y = rect.height * state.yPct;
          clamp(state, rect.width, rect.height);
          render(state);
        });
      }

      let prev = performance.now();
      function loop(now) {
        const dt = Math.min(0.034, (now - prev) / 1000);
        prev = now;

        if (!reducedMotion) {
          const rect = board.getBoundingClientRect();
          states.forEach((state) => {
            if (!state.pause && !state.drag) {
              state.x += state.vx * dt;
              state.y += state.vy * dt;

              if (state.x <= 4 || state.x + state.w >= rect.width - 4) {
                state.vx *= -1;
                state.x = Math.max(4, Math.min(state.x, rect.width - state.w - 4));
              }
              if (state.y <= 4 || state.y + state.h >= rect.height - 4) {
                state.vy *= -1;
                state.y = Math.max(4, Math.min(state.y, rect.height - state.h - 4));
              }

              render(state);
            }
          });
        }

        requestAnimationFrame(loop);
      }

      initialLayout();
      requestAnimationFrame(loop);
      window.addEventListener("resize", initialLayout);

      // Subtle chibi background (reduced count)
      const chibiCount = Math.min(12, Math.max(5, Math.floor(window.innerWidth / 220)));
      for (let i = 0; i < chibiCount; i += 1) {
        const item = document.createElement("div");
        item.className = "chibi-float";
        item.style.left = `${Math.random() * 100}%`;
        item.style.top = `${Math.random() * 100}%`;
        item.style.setProperty("--size", `${52 + Math.random() * 86}px`);
        item.style.setProperty("--op", `${0.035 + Math.random() * 0.07}`);
        item.style.setProperty("--dur", `${14 + Math.random() * 22}s`);
        item.style.setProperty("--dx", `${-20 + Math.random() * 40}px`);
        item.style.setProperty("--dy", `${-24 + Math.random() * 48}px`);
        item.style.setProperty("--dr", `${-5 + Math.random() * 10}deg`);
        item.style.setProperty("--flip", Math.random() > 0.5 ? "-1" : "1");

        const img = document.createElement("img");
        img.src = "/pic/chibi3.png";
        img.alt = "";
        item.appendChild(img);
        chibiLayer.appendChild(item);
      }
    })();
  </script>
</body>
</html>
