<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Index 2 Placeholder Entry</title>
  <meta name="description" content="Entry page linking to index2." />
  <meta http-equiv="refresh" content="2;url=/index2.html" />
  <style>
    :root {
      --bg1: #fff5de;
      --bg2: #ffd996;
      --ink: #4a2a12;
      --line: rgba(74, 42, 18, 0.14);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Manrope", system-ui, sans-serif;
      color: var(--ink);
      background: linear-gradient(150deg, var(--bg1) 0%, var(--bg2) 100%);
    }

    .wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .card {
      width: min(560px, 100%);
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 250, 241, 0.82);
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 4vw, 2rem);
    }

    p {
      margin: 10px 0 0;
      line-height: 1.6;
    }

    a {
      margin-top: 14px;
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
      background: rgba(255,255,255,0.72);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="card">
      <h1>Opening Index 2</h1>
      <p>This is your placeholder entry page. You will be redirected automatically.</p>
      <a href="/index2.html">Open index2 now</a>
    </main>
  </div>
</body>
</html>
